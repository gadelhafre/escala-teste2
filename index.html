<!DOCTYPE html>
<html lang="pt-BR">
<head>

<style>
:root{--bg:#0e1110;--card:#161b19;--borda:#2b3330;--borda2:#222a27;--acc:#5ad2aa;--acc-esc:#07120e;--txt:#f4f7f5;--mut:#9aa8a2;--erro:#ff8a7a;--aviso:#ffc15c;--sup:#1b211f;--azul:#7cc4ff;--lilas:#d9a6ff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:3px solid var(--acc);background:#080a09;position:sticky;top:0;z-index:5}

#usuario{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 10px;color:var(--acc);font-weight:600}
.card h2{font-size:1.15rem}.card h3{font-size:1rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:8px 14px}
button:hover:not(:disabled){background:rgba(90,210,170,.14)}
button.cheio{background:var(--acc);color:var(--acc-esc);font-weight:700}

input,select,textarea{font:inherit;background:#0b0e0d;color:var(--txt);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;width:100%}

table{width:100%;border-collapse:collapse;font-size:.88rem}

.sbtn{padding:10px 6px;border:1px solid var(--borda);color:var(--txt);text-align:center}

<body>
<header class="topo"><strong>Quintal do Carmo · Escala 5x2</strong><span id="usuario"></span></header>

<div id="modal" class="modal" hidden><div id="modalBox" class="modal-box"></div></div>
<div id="toast"></div>

<script>
'use strict';
const CHAVE = 'quintal_escala_v1';
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DIAS_L = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const FUNCOES = { cozinha:'Cozinha', salao:'Salão', caixa:'Caixa', bar:'Bar e chopeira' };
const CATEGORIAS = ['Saúde / consulta','Família','Estudo','Transporte','Compromisso pessoal','Outro'];
const ST_REGRA = { lei:'lei', cct:'CCT', sistema:'regra do sistema', confirmar:'confirmar' };

// Tipos de dia. "trabalha" = conta na cobertura e na carga semanal.
const STATUS = {
  T:  { sigla:'trabalho', desc:'dia normal',          nome:'Trabalho',             cls:'w'  },
  F:  { sigla:'folga',    desc:'repouso',             nome:'Folga',                cls:'f'  },
  FJ: { sigla:'F.J',      desc:'falta justificada',   nome:'Falta justificada',    cls:'fj' },
  FI: { sigla:'F.INJ',    desc:'falta injustificada', nome:'Falta injustificada',  cls:'fi' },
  EX: { sigla:'EXTRA',    desc:'dia extra',           nome:'Dia extra',            cls:'ex' }
};
const ROT_CAL = { F:'folga', FJ:'F.J', FI:'F.INJ', EX:'extra' };
const MOTIVOS_FJ = [
  'Atestado médico ou odontológico (cl. 45)', 'Falecimento de familiar (cl. 46, a)', 'Casamento (cl. 46, b)',
  'Nascimento de filho (cl. 46, c)', 'Doação de sangue (cl. 46, d)', 'Alistamento ou serviço militar (cl. 46, e)',
  'Internação de cônjuge ou filho (cl. 46, f)', 'Acompanhar filho menor de 12 anos ao médico (cl. 46, g)',
  'Prova escolar, vestibular ou ENEM (cl. 44)', 'Outro motivo abonado'
];
const trabalha = s => s === 'T' || s === 'EX';

const app = document.getElementById('app');
const usuario = document.getElementById('usuario');

let estado = null;
let semanaGestor = '';
let abaGestor = 'pedidos';
let mesFunc = 0;
let projAtiva = '';
let mesResumo = '';

// ---------- utilidades ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => new Date(s + 'T12:00:00');
const addDias = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDias = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);
const dowM = s => (parse(s).getDay() + 6) % 7;            // 0 = segunda ... 6 = domingo
const iniSemana = s => addDias(s, -dowM(s));
const hojeISO = () => iso(new Date());
const dataBR = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const dataBRfull = s => dataBR(s) + '/' + s.slice(0, 4);
const idxSemana = ws => Math.round((parse(ws) - parse('2024-01-01')) / (7 * 86400000));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const stamp = () => { const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parTxt = p => (p && p.length) ? p.map(i => DIAS_L[i]).join(' e ') : '—';
const funcionario = id => estado.funcionarios.find(f => f.id === id);
const feriadoDe = data => { const x = estado.feriados.find(f => f.data === data); return x ? x.nome : ''; };
const equipeDe = funcao => estado.funcionarios.filter(f => !f.gestor && f.funcao === funcao);
const normNome = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
async function hashCPF(cpf) {
  const d = cpf.replace(/\D/g, '');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('quintal-escala|' + d));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function salvar() { localStorage.setItem(CHAVE, JSON.stringify(estado)); }
function logar(txt) { estado.log.unshift({ t: stamp(), texto: txt }); estado.log = estado.log.slice(0, 300); }
const quemSou = () => { const f = funcionario(sessionStorage.getItem('quintal_sessao')); return f ? f.nome : ''; };

// ---------- horários (ponto) ----------
const minDe = t => (typeof t === 'string' && /^\d{2}:\d{2}$/.test(t)) ? (+t.slice(0, 2)) * 60 + (+t.slice(3)) : null;
function minBruto(e) {
  if (!e) return null;
  const a = minDe(e.ent), b = minDe(e.sai);
  if (a == null || b == null) return null;
  let d = b - a; if (d < 0) d += 1440;
  return d;
}
function minTrab(e) { const b = minBruto(e); return b == null ? null : Math.max(0, b - (+e.int || 0)); }
const fmtH = m => m == null ? '—' : Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : '');
const fmtSaldo = m => m === 0 ? '0h' : (m > 0 ? '+' : '−') + fmtH(Math.abs(m));
const horarioTurno = turno => turno === 'Manhã/Tarde' ? ['08:00', '17:00', 60] : turno === 'Tarde/Noite' ? ['15:00', '00:00', 60] : ['09:00', '18:00', 60];
const horarioPadrao = f => (f.hEnt || '—') + '–' + (f.hSai || '—');
// minutos entre a saída de um dia e a entrada do dia seguinte
function gapJornadas(pe, ne) {
  const a = minDe(pe && pe.ent), b = minDe(pe && pe.sai), c = minDe(ne && ne.ent);
  if (a == null || b == null || c == null) return null;
  return 1440 + c - (b < a ? b + 1440 : b);
}
function avisosHorario(f, data, hv, L) {
  const av = [];
  if (!hv.ent && !hv.sai) return av;
  if (!hv.ent || !hv.sai) { av.push('Falta preencher ' + (hv.ent ? 'a saída' : 'a entrada') + '.'); return av; }
  const bruto = minBruto(hv), m = minTrab(hv), it = +hv.int || 0;
  if (bruto === 0) av.push('Entrada e saída iguais.');
  if (m != null && m > 600) av.push('Jornada de ' + fmtH(m) + ' no dia: acima de 10 h (regra geral da CLT, art. 59, admite no máximo 2 h extras por dia; conferir a CCT).');
  if (bruto > 360 && it < 60) av.push('Jornada acima de 6 h normalmente pede intervalo de ao menos 1 h (regra geral da CLT, art. 71; conferir se a CCT prevê outra regra).');
  else if (bruto > 240 && bruto <= 360 && it < 15) av.push('Jornada entre 4 h e 6 h normalmente pede intervalo de ao menos 15 min (CLT, art. 71).');
  const prev = L[addDias(data, -1) + '|' + f.id], next = L[addDias(data, 1) + '|' + f.id];
  const g1 = gapJornadas(prev, hv), g2 = gapJornadas(hv, next);
  if (g1 != null && g1 < 660) av.push('Só ' + fmtH(g1) + ' entre a saída de ontem e a entrada de hoje (descanso entre jornadas: 11 h, CLT art. 66; conferir a CCT).');
  if (g2 != null && g2 < 660) av.push('Só ' + fmtH(g2) + ' entre a saída de hoje e a entrada de amanhã (descanso entre jornadas: 11 h, CLT art. 66; conferir a CCT).');
  return av;
}

function toast(msg, erro) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (erro ? ' erro' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ''), 4200);
}
function abrirModal(...c) {
  const box = document.getElementById('modalBox');
  box.replaceChildren(...c.flat(Infinity).filter(x => x != null && x !== false));
  document.getElementById('modal').hidden = false;
}
function fecharModal() { document.getElementById('modal').hidden = true; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });
function baixar(nome, texto, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([texto], { type: tipo }));
  a.download = nome; document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 2000);
}

// Converte dados de versões anteriores e garante os campos novos.
function migrar(s) {
  estado = s;
  if (!s.dias) {
    s.dias = {};
    Object.keys(s.escala || {}).forEach(k => {
      const i = k.indexOf('|'), ws = k.slice(0, i), f = funcionario(k.slice(i + 1));
      if (f) Object.assign(s.dias, comPar(f, ws, s.escala[k], s.dias));
    });
    delete s.escala;
  }
  s.projecoes = s.projecoes || [];
  s.log = s.log || [];
  if (!s.inicioRegistro) s.inicioRegistro = addDias(iniSemana(hojeISO()), -56);
  if (s.registradoAte == null) s.registradoAte = '';
  s.funcionarios.forEach(f => {
    if (f.hEnt == null) { const [a, b, c] = horarioTurno(f.turno); f.hEnt = a; f.hSai = b; f.hInt = c; }
  });
  REGRAS_V2.forEach((r, i) => { if (!s.regras.some(x => x.titulo === r.titulo)) s.regras.push(Object.assign({ id: 'r' + Date.now() + i }, r)); });
  s.v = 3; salvar(); return s;
}

// ---------- motor de escala ----------
// Padrão do sistema: folgas-base com rodízio de domingo (a cada 4 semanas).
function padraoPar(f, ws) {
  if (!f.base || !f.base.length) return [];
  if (estado.params.domingoACadaDias > 0 && (((idxSemana(ws) + f.off) % 4) + 4) % 4 === 0 && !f.base.includes(6))
    return [f.base[0], 6].sort((a, b) => a - b);
  return f.base.slice();
}
const padrao = (f, data) => padraoPar(f, iniSemana(data)).includes(dowM(data)) ? 'F' : 'T';
// Cada dia pode ter uma entrada própria: { s, obs, motivo, ent, sai, int, auto, por, em }
const entrada = (f, data, ov) => (ov || estado.dias)[data + '|' + f.id];
function statusDia(f, data, ov) { const e = entrada(f, data, ov); return e ? e.s : padrao(f, data); }
function parDe(f, ws, ov) { const r = []; for (let d = 0; d < 7; d++) if (statusDia(f, addDias(ws, d), ov) === 'F') r.push(d); return r; }
// Devolve cópia da camada com as folgas da semana trocadas para "par".
function comPar(f, ws, par, ov) {
  const base = ov || estado.dias, r = Object.assign({}, base);
  for (let d = 0; d < 7; d++) {
    const data = addDias(ws, d), k = data + '|' + f.id, cur = statusDia(f, data, base), old = base[k];
    if (par.includes(d)) { if (cur !== 'F') r[k] = { s: 'F', obs: (old && old.obs) || '' }; }
    else if (cur === 'F') r[k] = { s: 'T', obs: (old && old.obs) || '' };
  }
  return r;
}
// Registra (congela) as semanas que já passaram, para que mudanças futuras nas regras não reescrevam o histórico.
function registrarPassado() {
  const hoje = iniSemana(hojeISO());
  let ws = estado.registradoAte ? addDias(estado.registradoAte, 7) : estado.inicioRegistro, mudou = false;
  while (ws < hoje) {
    estado.funcionarios.filter(f => !f.gestor).forEach(f => {
      for (let d = 0; d < 7; d++) {
        const data = addDias(ws, d), k = data + '|' + f.id;
        if (!estado.dias[k]) estado.dias[k] = { s: padrao(f, data), obs: '', auto: true };
      }
    });
    estado.registradoAte = ws; ws = addDias(ws, 7); mudou = true;
  }
  if (mudou) salvar();
}
function maxSeguidos(f, ws, ov) {
  let max = 0, run = 0;
  for (let n = -7; n < 21; n++) { if (trabalha(statusDia(f, addDias(ws, n), ov))) { run++; if (run > max) max = run; } else run = 0; }
  return max;
}
function diasSemDomingo(f, ref, ov) {
  let d = addDias(iniSemana(ref), 6); if (d > ref) d = addDias(d, -7);
  for (let k = 0; k < 12; k++) { if (statusDia(f, d, ov) === 'F') return diffDias(ref, d); d = addDias(d, -7); }
  return 999;
}
function limiteEm(ws) {
  const p = estado.params;
  if (ws >= p.dataLimite40) return p.limiteApos2;
  if (ws >= p.dataEmenda) return p.limiteApos1;
  return p.limiteAtual;
}
function cobertura(funcao, ws, ov) {
  const eq = equipeDe(funcao);
  return DIAS.map((_, d) => eq.filter(f => trabalha(statusDia(f, addDias(ws, d), ov))).length);
}
function furos(funcao, ws, ov) {
  const c = cobertura(funcao, ws, ov), m = estado.minimos[funcao] || [];
  const r = []; c.forEach((v, d) => { if (v < (m[d] || 0)) r.push({ dia: d, falta: m[d] - v }); });
  return r;
}
const totalFalta = arr => arr.reduce((a, x) => a + x.falta, 0);

// Erros que bloqueiam o PEDIDO DO FUNCIONÁRIO (o gestor só recebe avisos)
function validar(f, ws, par, ov) {
  const p = estado.params, m = [];
  if (par.length !== p.folgasSemana) m.push('A semana precisa ter exatamente ' + p.folgasSemana + ' folgas.');
  const ms = maxSeguidos(f, ws, comPar(f, ws, par, ov));
  if (ms > p.maxSeguidos) m.push('Isso deixaria ' + ms + ' dias seguidos de trabalho (máximo ' + p.maxSeguidos + ').');
  return m;
}
function avisosDe(f, ws, tmp) {
  const p = estado.params, a = [];
  const sts = DIAS.map((_, d) => statusDia(f, addDias(ws, d), tmp));
  if (p.domingoACadaDias > 0) {
    const sd = diasSemDomingo(f, addDias(ws, 6), tmp);
    if (sd > p.domingoACadaDias) a.push('Ficaria ' + (sd >= 999 ? 'muito tempo' : sd + ' dias') + ' sem folga em domingo (referência: 1 a cada ' + p.domingoACadaDias + ' dias; regra a confirmar).');
  }
  const horas = sts.filter(trabalha).length * (f.horas || p.horasDia), lim = limiteEm(ws);
  if (horas > lim) a.push('A carga seria de ' + horas + ' h na semana, acima do limite de ' + lim + ' h.');
  sts.forEach((s, d) => {
    const data = addDias(ws, d), fer = feriadoDe(data);
    if (fer && trabalha(s)) a.push('Trabalha no feriado "' + fer + '" (' + dataBR(data) + '): compensar em até ' + p.feriadoCompDias + ' dias ou pagar em dobro.');
  });
  return a;
}
// Sugestão de remanejamento: troca folgas de colegas da mesma função para tapar furos.
function sugerir(funcao, ws, ov, ignorarId) {
  ov = ov || estado.dias;
  const hoje = hojeISO(); let trabalho = Object.assign({}, ov); const sug = [];
  const antes = furos(funcao, ws, ov);
  for (let guard = 0; guard < 12; guard++) {
    const fs = furos(funcao, ws, trabalho); if (!fs.length) break;
    const fur = fs[0]; let achou = false;
    for (const f of equipeDe(funcao)) {
      if (achou) break;
      if (f.id === ignorarId) continue;
      const par = parDe(f, ws, trabalho);
      if (!par.includes(fur.dia) || addDias(ws, fur.dia) < hoje) continue;
      for (let d2 = 0; d2 < 7; d2++) {
        const dt2 = addDias(ws, d2);
        if (dt2 < hoje || statusDia(f, dt2, trabalho) !== 'T') continue;
        const novo = par.filter(x => x !== fur.dia).concat(d2).sort((a, b) => a - b);
        if (validar(f, ws, novo, trabalho).length) continue;
        const t2 = comPar(f, ws, novo, trabalho);
        if (totalFalta(furos(funcao, ws, t2)) >= totalFalta(fs)) continue;
        trabalho = t2; achou = true;
        sug.push({ id: f.id, nome: f.nome, de: par, para: novo, texto: f.nome + ': folga ' + parTxt(par) + ' passa para ' + parTxt(novo) });
        break;
      }
    }
    if (!achou) break;
  }
  const restantes = furos(funcao, ws, trabalho);
  return { ws, furosAntes: antes, sugestoes: sug, restantes, resolve: restantes.length === 0 };
}
function aplicarMudanca(f, ws, par, remanejo, motivo, ov) {
  const L = ov || estado.dias;
  Object.assign(L, comPar(f, ws, par, L));
  (remanejo || []).forEach(s => { const g = funcionario(s.id); if (g) Object.assign(L, comPar(g, ws, s.para, L)); });
  logar(ctxLog() + motivo + ': ' + f.nome + ', semana de ' + dataBR(ws) + ' (' + parTxt(par) + ')' + ((remanejo || []).length ? ' com ' + remanejo.length + ' troca(s) de colegas' : ''));
  salvar();
}
function auditar(f, ws, ov) {
  const p = estado.params, motivos = [];
  const sts = DIAS.map((_, d) => statusDia(f, addDias(ws, d), ov));
  const cont = s => sts.filter(x => x === s).length;
  const folgas = cont('F'), fj = cont('FJ'), fi = cont('FI'), ex = cont('EX');
  const ms = maxSeguidos(f, ws, ov), sd = diasSemDomingo(f, addDias(ws, 6), ov);
  const horas = sts.filter(trabalha).length * (f.horas || p.horasDia), lim = limiteEm(ws), fers = [];
  let reg = 0, temReg = false;
  DIAS.forEach((_, d) => { const m = minTrab((ov || estado.dias)[addDias(ws, d) + '|' + f.id]); if (m != null) { reg += m; temReg = true; } });
  sts.forEach((s, d) => { const dt = addDias(ws, d), fer = feriadoDe(dt); if (fer && trabalha(s)) fers.push(fer + ' (' + dataBR(dt) + ')'); });
  if (folgas < p.folgasSemana) motivos.push(folgas + ' folga(s) na semana (regra: ' + p.folgasSemana + ')');
  if (ms > p.maxSeguidos) motivos.push(ms + ' dias seguidos');
  if (p.domingoACadaDias > 0 && sd > p.domingoACadaDias) motivos.push('sem folga em domingo há mais de ' + p.domingoACadaDias + ' dias (a confirmar)');
  if (horas > lim) motivos.push(horas + ' h previstas, acima do limite de ' + lim + ' h');
  if (temReg && reg > lim * 60) motivos.push(fmtH(reg) + ' registradas, acima do limite de ' + lim + ' h');
  if (fi) motivos.push('falta injustificada: Vale Compra do mês em risco');
  if (ex) motivos.push('dia(s) extra(s): conferir pagamento ou compensação');
  return { f, folgas, fj, fi, ex, ms, sd, horas, lim, fers, reg: temReg ? reg : null, motivos };
}
function resumoMes(f, ym, L) {
  const r = { T: 0, F: 0, FJ: 0, FI: 0, EX: 0, exDom: 0, exFer: 0, min: 0 };
  const ult = new Date(+ym.slice(0, 4), +ym.slice(5, 7), 0).getDate();
  for (let d = 1; d <= ult; d++) {
    const data = ym + '-' + pad(d), s = statusDia(f, data, L); r[s]++;
    if (s === 'EX') { if (dowM(data) === 6) r.exDom++; if (feriadoDe(data)) r.exFer++; }
    r.min += minTrab(L[data + '|' + f.id]) || 0;
  }
  return r;
}

// Análise de um dia: tudo é aviso, nada bloqueia o gestor.
function analisarDia(f, data, s, L) {
  const p = estado.params, ws = iniSemana(data), dow = dowM(data);
  const atual = statusDia(f, data, L), pd = padrao(f, data);
  const tmp = Object.assign({}, L, { [data + '|' + f.id]: { s } });
  const avisos = [], infos = [];
  if (s !== atual) {
    if (s === 'F' || atual === 'F') {
      const n = parDe(f, ws, tmp).length;
      if (n !== p.folgasSemana) avisos.push('A semana ficaria com ' + n + ' folga(s); a regra é ' + p.folgasSemana + ' (a confirmar na emenda).' + (n === 1 ? ' Pode haver exceção por convenção ou acordo coletivo: confirmar.' : ''));
    }
    const ms = maxSeguidos(f, ws, tmp);
    if (ms > p.maxSeguidos) avisos.push('Isso deixaria ' + ms + ' dias seguidos de trabalho (máximo ' + p.maxSeguidos + ').');
    const c = cobertura(f.funcao, ws, tmp)[dow], mn = (estado.minimos[f.funcao] || [])[dow] || 0;
    if (c < mn) avisos.push('Cobertura de ' + FUNCOES[f.funcao] + ' em ' + DIAS_L[dow] + ' ficaria em ' + c + '/' + mn + '.');
    avisosDe(f, ws, tmp).forEach(x => { if (!avisos.includes(x)) avisos.push(x); });
  }
  if (s === 'FJ') {
    infos.push('Falta justificada: dia abonado, sem desconto de salário nem de repouso (CCT cl. 44 a 46). Guarde o comprovante.');
    infos.push('Não conta na cobertura nem na carga semanal. Atestado de telemedicina além do período do atendimento exige atestado presencial (cl. 24, §10).');
  }
  if (s === 'FI') {
    avisos.push('Falta injustificada: perde o Vale Compra Alimentação do mês (CCT cl. 21, §2).');
    avisos.push('O dia pode ser descontado, e o repouso semanal remunerado da semana pode ser perdido pela regra geral (Lei 605/49): confirmar com o contador.');
    infos.push('Não conta na cobertura nem na carga semanal.');
  }
  if (s === 'EX') {
    if (pd === 'F' && dow === 6) avisos.push('Domingo de folga trabalhado: pago em dobro e fora do banco de horas (CCT cl. 42, §1 e §4).');
    else if (pd === 'F') avisos.push('Folga semanal trabalhada: pagar em dobro ou dar outra folga na mesma semana (confirmar com o sindicato ou contador).');
    if (pd === 'T') infos.push('Este dia já era de trabalho na escala. Use Extra para dias além da escala; horas acima da jornada seguem a regra de hora extra (adicional de 80%, ou 50% no REPIS, cl. 17).');
    infos.push('Conta na cobertura e na carga semanal.');
  }
  if (s === 'T' && pd === 'F') infos.push('Trabalho no lugar da folga: a folga deste dia é perdida. Se for um dia a mais, e não uma troca, use Extra.');
  if (s === 'F' && pd === 'T') infos.push('Folga em um dia que era de trabalho.');
  return { avisos, infos };
}

const ctxLog = () => { const p = projAtual(); return p && abaGestor !== 'pedidos' ? '[Projeção ' + p.nome + '] ' : ''; };

// ---------- sessão e entrada ----------
function barra(nome, papel) {
  document.body.classList.remove('entrada');
  usuario.replaceChildren(h('span', { class: 'sutil' }, nome + ' · ' + papel), h('button', { class: 'pq', onclick: sair }, 'Sair'));
}
function sair() { sessionStorage.removeItem('quintal_sessao'); telaEntrada(); }
function telaEntrada() {

  const cpf = h('input', { inputmode: 'numeric', maxlength: '14', placeholder: 'CPF', 'aria-label': 'CPF', autocomplete: 'off' });
  cpf.addEventListener('input', () => {
    const d = cpf.value.replace(/\D/g, '').slice(0, 11);
    cpf.value = d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
  });
  const msg = h('div');
  const botao = h('button', { class: 'cheio', type: 'submit' }, 'Entrar');
  const form = h('form', { class: 'entra-card', novalidate: 'novalidate' }, nome, cpf, msg, botao);
  form.addEventListener('submit', async ev => {
    ev.preventDefault(); botao.disabled = true;
    try {
      const hs = await hashCPF(cpf.value), n = normNome(nome.value);
      const f = estado.funcionarios.find(x => normNome(x.nome) === n && x.cpfHash === hs);
      if (!f) throw new Error('Nome ou CPF não conferem.');
      sessionStorage.setItem('quintal_sessao', f.id); iniciar();
    } catch (e) { msg.replaceChildren(h('div', { class: 'msg erro' }, e.message)); }
    finally { botao.disabled = false; }
  });
  const demo = estado.demoAtivo ? h('div', { class: 'card demo' }, h('h3', {}, 'Contas de demonstração (fictícias)'),
    h('p', { class: 'sutil pequeno' }, 'Toque para preencher. Não use CPF real neste protótipo.'),
    DEMO.map(d => h('button', { class: 'pq', type: 'button', onclick: () => { nome.value = d.nome; cpf.value = d.cpf; } }, d.nome + (d.gestor ? ' (gestora)' : '')))) : null;
  app.replaceChildren(h('div', { class: 'entra' }, h('h1', {}, 'Quintal do Carmo'), h('p', { class: 'sutil' }, 'Escala de folgas 5x2'), form, demo));
  nome.focus();
}
function iniciar() {
  const f = funcionario(sessionStorage.getItem('quintal_sessao'));
  if (!f) return telaEntrada();
  registrarPassado();
  if (f.gestor) { semanaGestor = semanaGestor || iniSemana(hojeISO()); return painelGestor(); }
  painelFuncionario(f);
}

// ---------- componentes ----------
function listaMsg(arr, erro) { return h('div', { class: 'msg' + (erro ? ' erro' : '') }, h('ul', {}, arr.map(x => h('li', {}, x)))); }
function seletorDias(f, ws, parInicial, aoMudar) {
  const hoje = hojeISO(), sel = new Set(parInicial), max = estado.params.folgasSemana;
  const box = h('div', { class: 'semana' });
  const els = DIAS.map((nome, d) => {
    const data = addDias(ws, d), st = statusDia(f, data), fer = feriadoDe(data);
    const travado = data < hoje || (st !== 'T' && st !== 'F');
    const el = h('div', { class: 'dia escolha' + (travado ? ' travado' : ''), tabindex: travado ? '-1' : '0', role: 'button' },
      h('b', {}, nome), h('small', {}, dataBR(data)), h('span', { class: 't' }, ''), fer ? h('span', { class: 'fer' }, fer) : null);
    const alterna = () => {
      if (travado) return;
      if (sel.has(d)) sel.delete(d);
      else if (sel.size < max) sel.add(d);
      else { toast('Desmarque um dia antes de escolher outro.', true); return; }
      pinta();
    };
    el.addEventListener('click', alterna);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alterna(); } });
    box.append(el); return { el, d, travado, st };
  });
  function pinta() {
    els.forEach(x => {
      const on = sel.has(x.d); x.el.classList.toggle('sel', on);
      let t;
      if (x.st === 'FJ' || x.st === 'FI' || x.st === 'EX') t = STATUS[x.st].sigla;
      else if (x.travado) t = on ? 'folga (passou)' : 'passou';
      else t = on ? 'FOLGA' : 'trabalho';
      x.el.querySelector('.t').textContent = t;
    });
    aoMudar(sel);
  }
  pinta();
  return { box, sel };
}
function blocoPlano(pl, titulo) {
  return h('div', { class: 'msg' + (pl.resolve ? '' : ' erro') }, h('b', {}, titulo),
    h('ul', {}, pl.furosAntes.map(x => h('li', {}, DIAS_L[x.dia] + ' (' + dataBR(addDias(pl.ws, x.dia)) + '): falta ' + x.falta + (x.falta > 1 ? ' pessoas' : ' pessoa')))),
    pl.sugestoes.length ? h('div', {}, h('b', {}, 'Quem pode trocar (só muda se você aprovar):'), h('ul', {}, pl.sugestoes.map(s => h('li', {}, s.texto)))) : null,
    pl.resolve ? null : h('p', {}, 'Não achei como cobrir tudo sem quebrar as travas. Clique nos dias da tabela para ajustar à mão.'));
}

// ---------- funcionário ----------
function painelFuncionario(f) {

  const dt = new Date(+m0.slice(0, 4), +m0.slice(5, 7), 1);
  const m1 = dt.getFullYear() + '-' + pad(dt.getMonth() + 1);
  const mes = mesFunc ? m1 : m0;
  const nomeMes = MESES[+mes.slice(5, 7) - 1] + ' de ' + mes.slice(0, 4);
  const limite = addDias(iniSemana(hoje), 13);
  const navMes = h('div', { class: 'nav-mes' },
    h('button', { disabled: mesFunc === 0, 'aria-label': 'Mês anterior', onclick: () => { mesFunc = 0; painelFuncionario(f); } }, '‹'),
    h('h3', {}, nomeMes.charAt(0).toUpperCase() + nomeMes.slice(1)),
    h('button', { disabled: mesFunc === 1, 'aria-label': 'Próximo mês', onclick: () => { mesFunc = 1; painelFuncionario(f); } }, '›'));
  const ult = iso(new Date(+mes.slice(0, 4), +mes.slice(5, 7), 0));
  const ini = iniSemana(mes + '-01'), fim = addDias(iniSemana(ult), 6), celulas = [];

    const fora = d.slice(0, 7) !== mes, st = fora ? 'T' : statusDia(f, d), fer = feriadoDe(d);
    celulas.push(h('div', { class: 'cal-dia' + (fora ? ' fora' : '') + (st !== 'T' ? ' st-' + st : '') + (d > limite ? ' prev' : '') + (d === hoje ? ' hoje' : ''), title: fer },
      h('b', {}, String(+d.slice(8))), st !== 'T' ? h('span', { class: 't' }, ROT_CAL[st]) : null, !fora && fer ? h('span', { class: 'fer' }, fer) : null));
  }
  const linhas = [0, 7].map(n => {
    const ws = addDias(iniSemana(hoje), n), par = parDe(f, ws);
    const peds = estado.pedidos.filter(p => p.funcId === f.id && p.semana === ws), ped = peds[peds.length - 1];
    const emAnalise = ped && ped.status === 'pendente';
    const st = { pendente: 'em análise pelo gestor', aprovada: 'validado', recusada: 'recusado', cancelada: 'cancelado' };
    const cancelar = () => { ped.status = 'cancelada'; logar(f.nome + ' cancelou o pedido da semana de ' + dataBR(ws)); salvar(); toast('Pedido cancelado.'); painelFuncionario(f); };
    return h('div', { class: 'linha-semana' },
      h('div', {}, h('b', {}, n === 0 ? 'Esta semana' : 'Próxima semana'), h('span', { class: 'sutil' }, ' (' + dataBR(ws) + ' a ' + dataBR(addDias(ws, 6)) + ')'),
        h('div', {}, 'Folgas: ', h('b', {}, parTxt(par))),
        ped ? h('div', { class: 'sutil pequeno' }, 'Pedido (' + parTxt(ped.novo) + '): ' + st[ped.status]) : null),
      h('div', { class: 'acoes' }, emAnalise ? h('button', { class: 'pq perigo', onclick: cancelar }, 'Cancelar pedido') : null,
        h('button', { class: 'pq aviso', onclick: () => modalPedido(f, ws) }, emAnalise ? 'Trocar pedido' : 'Pedir mudança')));
  });

    h('div', { class: 'card' }, h('h2', {}, f.nome + ' · ' + FUNCOES[f.funcao]), navMes, h('div', { class: 'cal' }, DIAS.map(d => h('div', { class: 'cal-cab' }, d)), celulas),
      h('div', { class: 'legenda' }, h('span', {}, h('i', { class: 'l-folga' }), 'Folga'), h('span', {}, h('i', { class: 'l-fj' }), 'F.J'), h('span', {}, h('i', { class: 'l-fi' }), 'F.INJ'),
        h('span', {}, h('i', { class: 'l-ex' }), 'Extra'), h('span', {}, h('i', { class: 'l-prev' }), 'Previsão'), h('span', {}, h('i', { class: 'l-hoje' }), 'Hoje')),
      h('p', { class: 'sutil pequeno' }, 'Depois da próxima semana a escala é uma previsão e pode mudar. Dias com nome embaixo são feriados.')),
    h('div', { class: 'card' }, h('h2', {}, 'Mudar uma folga'),
      h('p', { class: 'sutil pequeno' }, 'Dá para pedir mudança na semana atual e na próxima. O gestor valida ou recusa.'), linhas));

function modalPedido(f, ws) {
  const msg = h('div'), enviar = h('button', { class: 'cheio', disabled: true }, 'Enviar pedido ao gestor');
  const atual = parDe(f, ws);
  const { box, sel } = seletorDias(f, ws, atual, s => {
    msg.replaceChildren(); enviar.disabled = true;
    if (s.size !== estado.params.folgasSemana) return;
    const par = [...s].sort((a, b) => a - b);
    if (par.join() === atual.join()) return;
    const erros = validar(f, ws, par);
    if (erros.length) { msg.append(listaMsg(erros, true)); return; }
    const av = avisosDe(f, ws, comPar(f, ws, par));
    if (av.length) msg.append(listaMsg(av, false));
    enviar.disabled = false;
  });
  const cat = h('select', {}, CATEGORIAS.map(c => h('option', { value: c }, c)));
  const motivo = h('textarea', { rows: '2', maxlength: '140', placeholder: 'Só o necessário. Evite detalhes de saúde.' });
  enviar.addEventListener('click', () => {
    const par = [...sel].sort((a, b) => a - b);
    estado.pedidos.filter(p => p.funcId === f.id && p.semana === ws && p.status === 'pendente').forEach(p => (p.status = 'cancelada'));
    estado.pedidos.push({ id: 'p' + Date.now(), funcId: f.id, semana: ws, antigo: atual, novo: par, categoria: cat.value, motivo: motivo.value.trim().slice(0, 140), status: 'pendente', criadoEm: stamp() });
    logar(f.nome + ' pediu mudança de folga na semana de ' + dataBR(ws) + ' (' + parTxt(par) + ')');

  });

    h('p', { class: 'sutil' }, 'Folgas atuais: ' + parTxt(atual) + '. Toque nos ' + estado.params.folgasSemana + ' dias da nova folga.'), box,
    h('label', {}, 'Categoria'), cat, h('label', {}, 'Motivo (opcional)'), motivo, msg,
    h('div', { class: 'acoes' }, enviar, h('button', { onclick: fecharModal }, 'Cancelar')));
}

function seletorSemana() {

    h('button', { class: 'pq', onclick: () => ir(addDias(ws, -7)) }, '‹ Anterior'),
    h('input', { type: 'date', value: ws, 'aria-label': 'Ir para a semana que contém a data', onchange: e => { if (e.target.value) ir(iniSemana(e.target.value)); } }),

    h('button', { class: 'pq', onclick: () => ir(hoje) }, 'Hoje'),

function cartaoPedido(p) {

    p.status = 'aprovada'; p.decididoEm = stamp(); salvar(); toast('Validado.'); painelGestor();
  };
  const recusarFn = () => { p.status = 'recusada'; p.decididoEm = stamp(); logar('Pedido de ' + f.nome + ' recusado'); salvar(); toast('Pedido recusado.'); painelGestor(); };

    h('div', {}, h('b', {}, f.nome), ' ', h('span', { class: 'badge' }, FUNCOES[f.funcao])),

    h('div', { class: 'acoes' }, h('button', { class: 'cheio', disabled: !ok, onclick: validarFn }, pl ? 'Validar com este remanejamento' : 'Validar'),
      h('button', { class: 'perigo', onclick: recusarFn }, 'Recusar')));

function gPedidos() {
  const pend = estado.pedidos.filter(p => p.status === 'pendente');
  const resto = estado.pedidos.filter(p => p.status !== 'pendente').slice(-8).reverse();

  return h('div', {},
    pend.length ? h('div', { class: 'alerta', role: 'alert' }, h('h2', { style: 'color:var(--erro)' }, pend.length + ' pedido(s) aguardando você'), h('p', { class: 'sutil pequeno' }, 'Pedidos valem sempre para a escala oficial.'), pend.map(cartaoPedido))

    resto.length ? h('div', { class: 'card' }, h('h3', {}, 'Últimas decisões'), h('ul', { class: 'limpa' }, resto.map(p => {
      const f = funcionario(p.funcId);
      return h('li', {}, h('b', {}, f ? f.nome : '(removido)'), ' · semana de ' + dataBR(p.semana) + ' · ' + parTxt(p.antigo) + ' → ' + parTxt(p.novo) + ' · ', h('span', { class: 'badge ' + (p.status === 'aprovada' ? 'ok' : 'bad') }, rot[p.status]));
    }))) : null);
}

// ----- escala e projeções -----
function diferencas(ws, p) {
  let n = 0;
  estado.funcionarios.filter(f => !f.gestor).forEach(f => {
    for (let d = 0; d < 7; d++) { const dt = addDias(ws, d); if (statusDia(f, dt, p.dias) !== statusDia(f, dt, estado.dias)) n++; }
  });
  return n;
}

function modalAplicar(p) {

  abrirModal(h('h2', {}, 'Aplicar projeção na escala oficial'),
    h('p', { class: 'sutil' }, 'Os dias do período escolhido ficam iguais aos da projeção "' + p.nome + '". Alterações oficiais desse período que não estão na projeção (inclusive horários registrados) serão desfeitas. A projeção continua salva.'),
    modo, h('div', { class: 'acoes' }, h('button', { class: 'cheio', onclick: () => {

    DIAS.map((_, d) => h('td', {}, h('input', { type: 'number', min: '0', max: '30', style: 'width:64px;text-align:center', 'aria-label': FUNCOES[fn] + ' ' + DIAS_L[d],
      value: String((estado.minimos[fn] || [])[d] || 0), onchange: e => {
        estado.minimos[fn] = estado.minimos[fn] || [0, 0, 0, 0, 0, 0, 0];
        estado.minimos[fn][d] = Math.max(0, parseInt(e.target.value, 10) || 0);
        salvar(); toast('Cobertura mínima salva.');
      } }))),
    h('td', { class: 'sutil' }, equipeDe(fn).length + ' pessoas')));
  return h('div', { class: 'card' }, h('h2', {}, 'Cobertura mínima'),
    h('p', { class: 'sutil pequeno' }, 'Quantas pessoas de cada função precisam estar trabalhando em cada dia da semana. Quando a escala fica abaixo disso, aparece "furo". Valores iniciais são exemplos: ajuste para a realidade do restaurante.'),
    h('div', { class: 'rolagem' }, h('table', {}, h('thead', {}, cab), h('tbody', {}, linhas))));
}

// ----- regras e parâmetros -----
function gRegras() {
  const p = estado.params;
  const CAMPOS = [
    ['cctNome', 'Convenção coletiva em uso (texto)', 'text'],
    ['folgasSemana', 'Folgas por semana', 'number'],
    ['maxSeguidos', 'Máximo de dias seguidos de trabalho', 'number'],
    ['horasDia', 'Horas por dia (padrão)', 'number'],
    ['limiteAtual', 'Limite semanal atual (horas)', 'number'],
    ['limiteApos1', 'Limite semanal na 2ª etapa (horas)', 'number'],
    ['dataEmenda', 'Início da 2ª etapa (data a confirmar)', 'date'],
    ['limiteApos2', 'Limite semanal na 3ª etapa (horas)', 'number'],
    ['dataLimite40', 'Início da 3ª etapa (data a confirmar)', 'date'],
    ['domingoACadaDias', 'Folga em domingo ao menos a cada X dias (0 = desligado)', 'number'],
    ['feriadoCompDias', 'Prazo para compensar feriado (dias)', 'number']
  ];
  const campos = CAMPOS.map(([chave, rot, tipo]) => h('div', {}, h('label', {}, rot),
    h('input', { type: tipo, value: String(p[chave] == null ? '' : p[chave]), onchange: e => {
      p[chave] = tipo === 'number' ? num(e.target.value) : e.target.value; salvar(); toast('Parâmetro salvo.');
    } })));
  const regras = estado.regras.map(r => h('div', { class: 'pedido', style: r.ativo ? '' : 'opacity:.55' },
    h('label', {}, 'Título'), h('input', { value: r.titulo, onchange: e => { r.titulo = e.target.value; salvar(); } }),
    h('div', { class: 'grade2' },
      h('div', {}, h('label', {}, 'Situação'), h('select', { onchange: e => { r.status = e.target.value; salvar(); toast('Salvo.'); } },
        Object.keys(ST_REGRA).map(k => h('option', { value: k, selected: r.status === k }, ST_REGRA[k])))),
      h('div', {}, h('label', {}, 'Fonte'), h('input', { value: r.fonte || '', onchange: e => { r.fonte = e.target.value; salvar(); } }))),
    h('label', {}, 'Texto da regra'), h('textarea', { rows: '4', value: r.descricao || '', onchange: e => { r.descricao = e.target.value; salvar(); } }),
    h('div', { class: 'acoes' },
      h('label', { style: 'display:inline-flex;gap:6px;align-items:center;margin:0' }, h('input', { type: 'checkbox', checked: !!r.ativo, onchange: e => { r.ativo = e.target.checked; salvar(); painelGestor(); } }), 'Em vigor'),
      h('button', { class: 'pq perigo', onclick: () => { if (confirm('Apagar esta regra?')) { estado.regras = estado.regras.filter(x => x.id !== r.id); salvar(); painelGestor(); } } }, 'Apagar'))));
  const fers = estado.feriados.slice().sort((a, b) => a.data.localeCompare(b.data));
  const fData = h('input', { type: 'date' }), fNome = h('input', { placeholder: 'Nome do feriado' });
  return h('div', {},
    h('div', { class: 'card' }, h('h2', {}, 'Parâmetros'),
      h('p', { class: 'sutil pequeno' }, 'São estes números que fazem o sistema avisar sobre folgas, dias seguidos, carga semanal e domingos. As datas das etapas da jornada foram calculadas por estimativa: confirme na publicação oficial. Quando sair a CCT 2026/2027, atualize aqui.'),
      h('div', { class: 'grade2' }, campos)),
    h('div', { class: 'card' }, h('h2', {}, 'Regras (texto de referência)'),
      h('p', { class: 'sutil pequeno' }, 'Os textos abaixo documentam de onde vem cada regra e podem ser editados à vontade. O que muda os avisos do sistema são os parâmetros acima. Regras marcadas como "confirmar" precisam de validação com sindicato ou contador.'),
      regras, h('div', { class: 'acoes' }, h('button', { class: 'pq', onclick: () => {
        estado.regras.push({ id: 'r' + Date.now(), titulo: 'Nova regra', status: 'confirmar', ativo: true, fonte: '', descricao: '' }); salvar(); painelGestor();
      } }, '+ Nova regra'))),
    h('div', { class: 'card' }, h('h2', {}, 'Feriados'),
      h('p', { class: 'sutil pequeno' }, 'Só estão cadastrados feriados nacionais de 2026 e 2027. Adicione os municipais de Araraquara e os que faltarem.'),
      h('ul', { class: 'limpa' }, fers.map(x => h('li', {}, dataBRfull(x.data) + ' · ' + x.nome + ' ',
        h('button', { class: 'pq perigo', onclick: () => { estado.feriados = estado.feriados.filter(y => y !== x); salvar(); painelGestor(); } }, 'remover')))),
      h('div', { class: 'grade2', style: 'margin-top:10px' }, fData, fNome),
      h('div', { class: 'acoes' }, h('button', { class: 'pq', onclick: () => {
        if (!fData.value || !fNome.value.trim()) return toast('Informe a data e o nome.', true);
        estado.feriados.push({ data: fData.value, nome: fNome.value.trim() }); salvar(); painelGestor();
      } }, '+ Adicionar feriado'))));
}

// ----- auditoria e resumo -----
function gAudit() {
  const L = camada(), ws = semanaGestor, ym = mesResumo || hojeISO().slice(0, 7);
  const eqs = estado.funcionarios.filter(f => !f.gestor);
  const aud = eqs.map(f => auditar(f, ws, L));
  const linhasSem = aud.map(a => h('tr', {}, h('td', {}, a.f.nome), h('td', {}, String(a.folgas)), h('td', {}, String(a.ms)),
    h('td', {}, a.horas + ' h' + (a.reg != null ? ' / ' + fmtH(a.reg) + ' reg.' : '')),
    h('td', { style: 'text-align:left' }, a.motivos.length ? h('ul', { style: 'margin:0;padding-left:16px' }, a.motivos.map(m => h('li', {}, m))) : h('span', { class: 'badge ok' }, 'ok'))));
  const linhasMes = eqs.map(f => {
    const r = resumoMes(f, ym, L);
    return h('tr', {}, h('td', {}, f.nome), h('td', {}, String(r.T)), h('td', {}, String(r.F)), h('td', {}, String(r.FJ)),
      h('td', { class: r.FI ? 'def' : '' }, String(r.FI)), h('td', {}, String(r.EX)), h('td', {}, r.exDom + ' / ' + r.exFer), h('td', {}, r.min ? fmtH(r.min) : '—'));
  });
  return h('div', {}, barraCamada(),
    h('div', { class: 'card' }, h('h2', {}, 'Auditoria da semana'), seletorSemana(),
      h('p', { class: 'sutil pequeno' }, 'Confere folgas, dias seguidos, carga semanal e horas registradas. Colunas: folgas na semana, maior sequência de dias de trabalho, horas previstas / horas registradas.'),
      h('div', { class: 'rolagem' }, h('table', {}, h('thead', {}, h('tr', {}, ['Colaborador', 'Folgas', 'Dias seguidos', 'Horas', 'Situação'].map(t => h('th', {}, t)))), h('tbody', {}, linhasSem)))),
    h('div', { class: 'card' }, h('h2', {}, 'Resumo do mês'),
      h('div', { class: 'nav-sem' }, h('input', { type: 'month', value: ym, onchange: e => { if (e.target.value) { mesResumo = e.target.value; painelGestor(); } } }),
        h('button', { class: 'pq', onclick: () => csvHorarios(ym) }, 'Baixar horários do mês (CSV)')),
      h('div', { class: 'rolagem' }, h('table', {}, h('thead', {}, h('tr', {}, ['Colaborador', 'Trabalho', 'Folga', 'F.J', 'F.INJ', 'Extra', 'Extra dom. / fer.', 'Horas registradas'].map(t => h('th', {}, t)))), h('tbody', {}, linhasMes)))));
}

// ----- registro e backup -----
function gLog() {
  const arq = h('input', { type: 'file', accept: 'application/json,.json', 'aria-label': 'Restaurar backup', onchange: e => {
    const fl = e.target.files[0]; if (!fl) return;
    const r = new FileReader();
    r.onload = () => {
      try {
        const o = JSON.parse(r.result);
        if (!o.funcionarios || !o.params) throw new Error('inválido');
        if (!confirm('Substituir todos os dados atuais pelo backup?')) return;
        migrar(o); logar('Backup restaurado'); salvar(); toast('Backup restaurado.'); iniciar();
      } catch (er) { toast('Arquivo de backup inválido.', true); }
    };
    r.readAsText(fl);
  } });
  return h('div', {},
    h('div', { class: 'card' }, h('h2', {}, 'Backup e exportação'),
      h('p', { class: 'sutil pequeno' }, 'Os dados ficam só neste navegador e neste aparelho. Faça backup de vez em quando, principalmente antes de limpar o histórico do navegador.'),
      h('div', { class: 'acoes' },
        h('button', { class: 'cheio', onclick: () => baixar('backup_escala_' + hojeISO() + '.json', JSON.stringify(estado, null, 1), 'application/json') }, 'Baixar backup (JSON)'),
        h('button', { onclick: () => csvHorarios('') }, 'Baixar todos os horários (CSV)')),
      h('label', {}, 'Restaurar um backup'), arq,
      h('div', { class: 'acoes' }, h('button', { class: 'perigo', onclick: async () => {
        if (!confirm('Apagar TODOS os dados e voltar à demonstração?')) return;
        localStorage.removeItem(CHAVE); projAtiva = ''; await criarEstadoInicial(); sessionStorage.removeItem('quintal_sessao'); telaEntrada();
      } }, 'Reiniciar demonstração'))),
    h('div', { class: 'card' }, h('h2', {}, 'Registro de atividades'),
      estado.log.length ? h('ul', { class: 'limpa' }, estado.log.slice(0, 80).map(x => h('li', {}, h('span', { class: 'sutil' }, x.t + ' · '), x.texto))) : h('p', { class: 'sutil' }, 'Nada registrado ainda.')));
}

// ---------- início ----------
(async function () {
  try {
    const salvo = localStorage.getItem(CHAVE);
    if (salvo) migrar(JSON.parse(salvo)); else await criarEstadoInicial();
  } catch (e) {
    console.error(e); await criarEstadoInicial();
  }
  iniciar();
})();
</script>
