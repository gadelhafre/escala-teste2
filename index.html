<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Assistente de Produção</title>
<style>
  :root { --bg:#12151a; --card:#1b2028; --line:#2b3340; --txt:#e8ecf1; --mut:#8b96a5; --ok:#3ecf8e; --warn:#f5b84b; --bad:#ef6b6b; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,Arial,sans-serif; background:var(--bg); color:var(--txt); }
  header { padding:16px 20px; border-bottom:1px solid var(--line); }
  header h1 { margin:0; font-size:20px; }
  header p { margin:4px 0 0; color:var(--mut); font-size:13px; }
  nav { display:flex; gap:6px; padding:10px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  nav button { background:transparent; color:var(--mut); border:1px solid var(--line); padding:8px 14px; border-radius:8px; cursor:pointer; font-size:14px; }
  nav button.on { background:var(--ok); color:#06210f; border-color:var(--ok); font-weight:600; }
  main { padding:20px; max-width:900px; margin:0 auto; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .card h3 { margin:0 0 10px; font-size:16px; }
  label { display:block; font-size:12px; color:var(--mut); margin:8px 0 4px; }
  input, select, textarea { width:100%; background:#10141a; color:var(--txt); border:1px solid var(--line); border-radius:8px; padding:9px; font-size:14px; }
  .row { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
  button.act { background:var(--ok); color:#06210f; border:0; padding:10px 18px; border-radius:8px; font-weight:600; cursor:pointer; margin-top:12px; }
  button.sec { background:transparent; color:var(--txt); border:1px solid var(--line); padding:8px 14px; border-radius:8px; cursor:pointer; margin:6px 6px 0 0; }
  button.del { background:transparent; color:var(--bad); border:1px solid var(--line); border-radius:6px; cursor:pointer; padding:4px 8px; }
  .big { font-size:28px; font-weight:700; }
  .mut { color:var(--mut); font-size:13px; }
  .tag { display:inline-block; padding:2px 8px; border-radius:999px; font-size:12px; margin-right:4px; border:1px solid var(--line); }
  .ok { color:var(--ok); } .warn { color:var(--warn); } .bad { color:var(--bad); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th, td { text-align:left; padding:8px 6px; border-bottom:1px solid var(--line); vertical-align:top; }
  th { color:var(--mut); font-weight:500; }
  .aviso { background:#2a2414; border:1px solid #5b4a1c; color:#e9d9a6; border-radius:10px; padding:10px 12px; font-size:13px; margin-bottom:14px; }
  .check { display:flex; align-items:center; gap:8px; margin-top:10px; }
  .check input { width:auto; }
</style>
</head>
<body>
<header>
  <h1>Assistente de Produção</h1>
  <p>Registre o fechamento do serviço e receba uma sugestão de quanto preparar.</p>
</header>
<nav id="nav"></nav>
<main id="view"></main>

<script>
// ---------- Parâmetros do modelo (ajuste conforme calibrar com pesagens) ----------
const FATOR = { sobrou_muito: 0.75, sobrou_pouco: 0.92, medida: 1.0, faltou: 1.12 };
const ROTULO = { sobrou_muito: 'Sobrou muito', sobrou_pouco: 'Sobrou pouco', medida: 'Na medida', faltou: 'Faltou' };
const MAX_COMPARAVEIS = 6;
const MIN_COMPARAVEIS = 2;
const DIAS = ['domingo','segunda','terça','quarta','quinta','sexta','sábado'];

// ---------- Dados da simulação (4 semanas) ----------
// Primeira segunda-feira da simulação: 16/11/2026 (o dia 15/11 cai num domingo).
// Para mudar o início, altere a linha abaixo (ano, mês começando em 0, dia).
const DATA_INICIO_SIMULACAO = Date.UTC(2026, 10, 16);

// Clientes por dia, de segunda a domingo, em cada semana.
const SIM_CLIENTES = [
  [80, 90, 95, 95, 110, 130, 120],   // semana 1
  [85, 95, 100, 100, 115, 135, 125], // semana 2
  [75, 85, 90, 95, 105, 125, 115],   // semana 3
  [90, 100, 105, 105, 120, 140, 130] // semana 4
];
// Quilos preparados por cliente (0,5 kg no total), conforme a tabela da simulação.
const SIM_KG_POR_CLIENTE = { i1: 0.15, i2: 0.18, i3: 0.10, i4: 0.07 };

const ITENS_PADRAO = [
  { id: 'i1', nome: 'Arroz',  unidade: 'kg', margem: 10, passo: 0.1 },
  { id: 'i2', nome: 'Feijão', unidade: 'kg', margem: 10, passo: 0.1 },
  { id: 'i3', nome: 'Carne',  unidade: 'kg', margem: 10, passo: 0.1 },
  { id: 'i4', nome: 'Salada', unidade: 'kg', margem: 10, passo: 0.1 }
];

function gerarSimulacao() {
  const regs = [];
  SIM_CLIENTES.forEach((semana, s) => {
    semana.forEach((clientes, d) => {
      const data = new Date(DATA_INICIO_SIMULACAO + (s * 7 + d) * 86400000).toISOString().slice(0, 10);
      const itens = {};
      Object.keys(SIM_KG_POR_CLIENTE).forEach(id => {
        // O arquivo da simulação só traz o que foi preparado; o resultado foi assumido como "Na medida".
        itens[id] = { qtd: Math.round(clientes * SIM_KG_POR_CLIENTE[id] * 100) / 100, res: 'medida', kg: null };
      });
      regs.push({ id: 'sim_' + data, data, servico: 'Almoço', refeicoes: clientes, obs: 'Dados de simulação', atipico: false, simulado: true, itens });
    });
  });
  return regs;
}

// ---------- Estado ----------
const CHAVE = 'assistente_producao_v2';
let estado = carregar();
let aba = 'fechamento';

function carregar() {
  try {
    const s = JSON.parse(localStorage.getItem(CHAVE));
    if (s && s.itens && s.registros) return s;
  } catch (e) {}
  return { itens: JSON.parse(JSON.stringify(ITENS_PADRAO)), registros: gerarSimulacao() };
}
function salvar() { localStorage.setItem(CHAVE, JSON.stringify(estado)); }

// ---------- Utilidades ----------
const $ = (id) => document.getElementById(id);
const hoje = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const diaSemana = (data) => new Date(data + 'T12:00:00').getDay();
const fmtData = (d) => d.split('-').reverse().join('/');
const esc = (t) => String(t ?? '').replace(/[&<>"']/g, c => ({ '&':'&', '<':'<', '>':'>', '"':'&quot;', "'":'&#39;' }[c]));
const media = (arr) => arr.reduce((a, b) => a + b, 0) / arr.length;
const arredonda = (v, passo) => Math.max(0, Math.round(v / (passo || 1)) * (passo || 1));
const num = (v) => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const fmtNum = (n) => (Math.round(n * 100) / 100).toString().replace('.', ',');
const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);
function segundaDe(data) {
  const d = new Date(data + 'T12:00:00');
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
// Soma, em kg, das preparações cuja unidade é "kg".
function kgDoRegistro(r) {
  return Object.entries(r.itens).reduce((soma, [id, v]) => {
    const it = estado.itens.find(i => i.id === id);
    return soma + (it && String(it.unidade).trim().toLowerCase() === 'kg' ? v.qtd : 0);
  }, 0);
}

// ---------- Navegação ----------
const ABAS = [['fechamento','Fechamento'], ['planejar','Planejar'], ['comparativo','Comparativo'], ['historico','Histórico'], ['config','Configurar']];
function desenhaNav() {
  $('nav').innerHTML = ABAS.map(([k, n]) => `<button class="${aba === k ? 'on' : ''}" onclick="ir('${k}')">${n}</button>`).join('');
}
function ir(k) { aba = k; render(); }
function render() {
  desenhaNav();
  if (aba === 'fechamento') viewFechamento();
  else if (aba === 'planejar') viewPlanejar();
  else if (aba === 'comparativo') viewComparativo();
  else if (aba === 'historico') viewHistorico();
  else viewConfig();
}

// ---------- Fechamento ----------
function viewFechamento() {
  const itens = estado.itens.map(it => `
    <div class="card">
      <h3>${esc(it.nome)}</h3>
      <div class="row">
        <div><label>Quantidade preparada (${esc(it.unidade)})</label><input type="number" step="any" min="0" id="q_${it.id}"></div>
        <div><label>Como terminou o serviço</label>
          <select id="r_${it.id}">
            <option value="">— escolha —</option>
            <option value="faltou">Faltou</option>
            <option value="medida">Ficou na medida</option>
            <option value="sobrou_pouco">Sobrou pouco</option>
            <option value="sobrou_muito">Sobrou muito</option>
          </select></div>
        <div><label>Sobra pesada em kg (opcional)</label><input type="number" step="any" min="0" id="k_${it.id}" placeholder="só em pesagens pontuais"></div>
      </div>
    </div>`).join('');

  $('view').innerHTML = `
    <div class="card">
      <h3>Dados do serviço</h3>
      <div class="row">
        <div><label>Data</label><input type="date" id="f_data" value="${hoje()}"></div>
        <div><label>Serviço</label><select id="f_serv"><option>Almoço</option><option>Jantar</option></select></div>
        <div><label>Refeições servidas</label><input type="number" min="1" id="f_ref"></div>
      </div>
      <label>Observação excepcional (chuva, grupo grande, receita nova...)</label>
      <input id="f_obs">
      <div class="check"><input type="checkbox" id="f_atip"><span class="mut">Dia atípico: guardar, mas não usar nas médias</span></div>
    </div>
    <p class="mut">Informe só o que a cozinha já sabe. Não precisa pesar tudo: “meia panela” já serve para comparar dias.</p>
    ${itens}
    <button class="act" onclick="salvarFechamento()">Salvar fechamento</button>
    <div id="f_msg" class="mut" style="margin-top:10px"></div>`;
}

function salvarFechamento() {
  const data = $('f_data').value, servico = $('f_serv').value, refeicoes = num($('f_ref').value);
  if (!data || refeicoes <= 0) { $('f_msg').innerHTML = '<span class="bad">Informe a data e o número de refeições servidas.</span>'; return; }

  const itens = {};
  estado.itens.forEach(it => {
    const qtd = num($('q_' + it.id).value), res = $('r_' + it.id).value, kg = $('k_' + it.id).value;
    if (qtd > 0 && res) itens[it.id] = { qtd, res, kg: kg === '' ? null : num(kg) };
  });
  if (!Object.keys(itens).length) { $('f_msg').innerHTML = '<span class="bad">Preencha quantidade e resultado de pelo menos uma preparação.</span>'; return; }

  const existente = estado.registros.findIndex(r => r.data === data && r.servico === servico);
  if (existente >= 0) {
    if (!confirm('Já existe um fechamento para essa data e serviço. Substituir?')) return;
    estado.registros.splice(existente, 1);
  }
  estado.registros.push({ id: 'r' + Date.now(), data, servico, refeicoes, obs: $('f_obs').value.trim(), atipico: $('f_atip').checked, itens });
  estado.registros.sort((a, b) => a.data.localeCompare(b.data));
  salvar();
  viewFechamento();
  $('f_msg').innerHTML = '<span class="ok">Fechamento salvo.</span>';
}

// ---------- Cálculo ----------
function comparaveis(data, servico) {
  const dow = diaSemana(data);
  return estado.registros
    .filter(r => r.servico === servico && diaSemana(r.data) === dow && r.data !== data)
    .sort((a, b) => b.data.localeCompare(a.data));
}

function calculaItem(it, comps, esperadas) {
  const validos = comps.filter(r => r.itens[it.id]).slice(0, MAX_COMPARAVEIS);
  if (validos.length < MIN_COMPARAVEIS) return { ok: false, n: validos.length };

  const consumoPorRef = media(validos.map(r => (r.itens[it.id].qtd * FATOR[r.itens[it.id].res]) / r.refeicoes));
  const preparadoPorRef = media(validos.map(r => r.itens[it.id].qtd / r.refeicoes));
  const demanda = esperadas * consumoPorRef;
  const sugerido = arredonda(demanda * (1 + it.margem / 100), it.passo);
  const padrao = arredonda(esperadas * preparadoPorRef, it.passo);
  const cont = { faltou: 0, medida: 0, sobrou_pouco: 0, sobrou_muito: 0 };
  validos.forEach(r => cont[r.itens[it.id].res]++);
  const kgs = validos.map(r => r.itens[it.id].kg).filter(k => k !== null);
  return { ok: true, n: validos.length, demanda, sugerido, padrao, cont, kgMedio: kgs.length ? media(kgs) : null, kgN: kgs.length };
}

// ---------- Planejar ----------
function viewPlanejar() {
  $('view').innerHTML = `
    <div class="card">
      <h3>Quanto preparar?</h3>
      <div class="row">
        <div><label>Data do serviço</label><input type="date" id="p_data" value="${hoje()}" onchange="atualizaPlano(true)"></div>
        <div><label>Serviço</label><select id="p_serv" onchange="atualizaPlano(true)"><option>Almoço</option><option>Jantar</option></select></div>
        <div><label>Refeições esperadas</label><input type="number" min="1" id="p_ref" oninput="atualizaPlano(false)"></div>
      </div>
      <p class="mut" id="p_info"></p>
    </div>
    <div id="p_res"></div>`;
  atualizaPlano(true);
}

function atualizaPlano(recalculaEsperadas) {
  const data = $('p_data').value, servico = $('p_serv').value;
  if (!data) return;
  const comps = comparaveis(data, servico);
  const usados = comps.filter(r => !r.atipico).slice(0, MAX_COMPARAVEIS);
  const atipicos = comps.length - comps.filter(r => !r.atipico).length;

  if (recalculaEsperadas) $('p_ref').value = usados.length ? Math.round(media(usados.map(r => r.refeicoes))) : '';
  const esperadas = num($('p_ref').value);

  $('p_info').innerHTML = usados.length
    ? `Base: ${usados.length} ${DIAS[diaSemana(data)]}(s) comparável(is) de ${servico.toLowerCase()}, com média de ${Math.round(media(usados.map(r => r.refeicoes)))} refeições.${atipicos ? ` ${atipicos} dia(s) atípico(s) ficaram de fora.` : ''} Se houver reserva ou evento, ajuste o número de refeições.`
    : `Ainda não há registros de ${DIAS[diaSemana(data)]} de ${servico.toLowerCase()}.`;

  if (esperadas <= 0) { $('p_res').innerHTML = '<p class="mut">Informe as refeições esperadas para ver a sugestão.</p>'; return; }

  $('p_res').innerHTML = `<div class="aviso">Estimativa baseada em histórico e em regras simples, não é medição exata. Teste ajustes pequenos e confirme com a cozinha.</div>` +
    estado.itens.map(it => {
      const c = calculaItem(it, usados, esperadas);
      if (!c.ok) return `<div class="card"><h3>${esc(it.nome)}</h3><p class="mut">Dados insuficientes: ${c.n} registro(s) comparável(is). São necessários pelo menos ${MIN_COMPARAVEIS}.</p></div>`;

      const diff = c.padrao > 0 ? ((c.sugerido - c.padrao) / c.padrao) * 100 : 0;
      let recomend, cls;
      if (c.cont.faltou > 0 && diff <= 0) { recomend = 'Já faltou em dias comparáveis. Não reduza a produção inicial; considere produzir em etapas.'; cls = 'warn'; }
      else if (diff <= -5) { recomend = `Testar uma redução de cerca de ${Math.abs(Math.round(diff))}% na produção inicial e acompanhar se ocorre falta.`; cls = 'ok'; }
      else if (diff >= 5) { recomend = `Histórico indica falta de margem: considere aumentar cerca de ${Math.round(diff)}%.`; cls = 'warn'; }
      else { recomend = 'A produção atual está próxima do adequado. Manter e continuar acompanhando.'; cls = 'ok'; }

      return `<div class="card">
        <h3>${esc(it.nome)}</h3>
        <div class="big">${fmtNum(c.sugerido)} <span class="mut">${esc(it.unidade)}(s)</span></div>
        <p class="mut">Demanda estimada: ${fmtNum(c.demanda)} + margem de ${it.margem}%. Padrão atual: ${fmtNum(c.padrao)}.</p>
        <p class="${cls}">${recomend}</p>
        <p>
          <span class="tag bad">Faltou: ${c.cont.faltou}</span>
          <span class="tag">Na medida: ${c.cont.medida}</span>
          <span class="tag">Sobrou pouco: ${c.cont.sobrou_pouco}</span>
          <span class="tag warn">Sobrou muito: ${c.cont.sobrou_muito}</span>
          <span class="mut">nos últimos ${c.n} dias comparáveis</span>
        </p>
        ${c.kgMedio !== null ? `<p class="mut">Sobra pesada média: ${fmtNum(c.kgMedio)} kg (${c.kgN} pesagem/ns).</p>` : ''}
      </div>`;
    }).join('');
}

// ---------- Comparativo ----------
function viewComparativo() {
  const regs = estado.registros.filter(r => !r.atipico);
  if (!regs.length) {
    $('view').innerHTML = '<div class="card"><p class="mut">Ainda não há registros para comparar.</p></div>';
    return;
  }
  const cabItens = estado.itens.map(it => `<th>${esc(it.nome)} (${esc(it.unidade)})</th>`).join('');

  const porDia = [1, 2, 3, 4, 5, 6, 0].map(d => {
    const rs = regs.filter(r => diaSemana(r.data) === d);
    if (!rs.length) return `<tr><td>${cap(DIAS[d])}</td><td colspan="${estado.itens.length + 4}" class="mut">sem registros</td></tr>`;
    const refMed = media(rs.map(r => r.refeicoes));
    const kgMed = media(rs.map(kgDoRegistro));
    const cols = estado.itens.map(it => {
      const v = rs.filter(r => r.itens[it.id]).map(r => r.itens[it.id].qtd);
      return `<td>${v.length ? fmtNum(media(v)) : '—'}</td>`;
    }).join('');
    return `<tr><td>${cap(DIAS[d])}</td><td>${rs.length}</td><td>${fmtNum(refMed)}</td>${cols}<td>${kgMed > 0 ? fmtNum(kgMed) : '—'}</td><td>${kgMed > 0 ? fmtNum(kgMed / refMed) : '—'}</td></tr>`;
  }).join('');

  const grupos = {};
  regs.forEach(r => { (grupos[segundaDe(r.data)] = grupos[segundaDe(r.data)] || []).push(r); });
  const semanas = Object.keys(grupos).sort();
  let anterior = null;
  const porSemana = semanas.map(seg => {
    const rs = grupos[seg];
    const ref = rs.reduce((a, r) => a + r.refeicoes, 0);
    const kg = rs.reduce((a, r) => a + kgDoRegistro(r), 0);
    let variacao = '—';
    if (anterior && anterior.dias === rs.length && anterior.ref > 0) {
      const v = ((ref - anterior.ref) / anterior.ref) * 100;
      variacao = `<span class="${v >= 0 ? 'ok' : 'warn'}">${v >= 0 ? '+' : ''}${fmtNum(v)}%</span>`;
    }
    anterior = { ref, dias: rs.length };
    return `<tr><td>${fmtData(seg)}</td><td>${rs.length}</td><td>${ref}</td><td>${kg > 0 ? fmtNum(kg) : '—'}</td><td>${kg > 0 ? fmtNum(kg / ref) : '—'}</td><td>${variacao}</td></tr>`;
  }).join('');

  $('view').innerHTML = `
    <div class="card">
      <h3>Média por dia da semana</h3>
      <p class="mut">Quanto se prepara, em média, em cada dia. Dias atípicos ficam de fora.</p>
      <div style="overflow-x:auto"><table>
        <tr><th>Dia</th><th>Registros</th><th>Média de refeições</th>${cabItens}<th>Total em kg</th><th>kg por refeição</th></tr>
        ${porDia}
      </table></div>
    </div>
    <div class="card">
      <h3>Semana a semana</h3>
      <p class="mut">A variação de refeições só aparece quando a semana tem o mesmo número de dias da anterior.</p>
      <div style="overflow-x:auto"><table>
        <tr><th>Semana (início)</th><th>Dias</th><th>Refeições</th><th>Total em kg</th><th>kg por refeição</th><th>Variação de refeições</th></tr>
        ${porSemana}
      </table></div>
    </div>`;
}

// ---------- Histórico ----------
function viewHistorico() {
  const nome = (id) => (estado.itens.find(i => i.id === id) || { nome: '(removido)' }).nome;
  const temSim = estado.registros.some(r => r.simulado);
  const linhas = [...estado.registros].reverse().map(r => `
    <tr>
      <td>${fmtData(r.data)}<br><span class="mut">${DIAS[diaSemana(r.data)]}, ${esc(r.servico)}</span></td>
      <td>${r.refeicoes}</td>
      <td>${Object.entries(r.itens).map(([id, v]) => `${esc(nome(id))}: ${fmtNum(v.qtd)} — ${ROTULO[v.res]}${v.kg !== null ? ` (${fmtNum(v.kg)} kg)` : ''}`).join('<br>')}</td>
      <td>${r.simulado ? '<span class="tag">simulação</span>' : ''}${r.atipico ? '<span class="tag warn">atípico</span>' : ''}${r.simulado ? '' : esc(r.obs)}</td>
      <td><button class="del" onclick="apagar('${r.id}')">Apagar</button></td>
    </tr>`).join('');

  $('view').innerHTML = `
    <div class="card">
      <h3>Histórico (${estado.registros.length} fechamentos)</h3>
      ${estado.registros.length ? `<div style="overflow-x:auto"><table>
        <tr><th>Data</th><th>Refeições</th><th>Preparações</th><th>Obs.</th><th></th></tr>${linhas}</table></div>` : '<p class="mut">Nenhum registro ainda.</p>'}
    </div>
    <div class="card">
      <h3>Dados de simulação</h3>
      <p class="mut">Os registros marcados como simulação são de teste. Remova antes de começar a usar com dados reais.</p>
      ${temSim ? '<button class="sec" onclick="removerSimulacao()">Remover dados de simulação</button>' : ''}
      <button class="sec" onclick="recarregarSimulacao()">Recarregar simulação de 4 semanas</button>
    </div>
    <div class="card">
      <h3>Backup e exportação</h3>
      <p class="mut">Os dados ficam salvos só neste navegador. Faça backup de vez em quando.</p>
      <button class="sec" onclick="exportarCSV()">Exportar CSV (planilha)</button>
      <button class="sec" onclick="exportarJSON()">Baixar backup</button>
      <button class="sec" onclick="$('imp').click()">Restaurar backup</button>
      <input type="file" id="imp" accept=".json" style="display:none" onchange="importarJSON(event)">
    </div>`;
}

function apagar(id) {
  if (!confirm('Apagar este fechamento?')) return;
  estado.registros = estado.registros.filter(r => r.id !== id);
  salvar(); viewHistorico();
}

function removerSimulacao() {
  if (!confirm('Remover todos os registros de simulação? Os fechamentos reais são mantidos.')) return;
  estado.registros = estado.registros.filter(r => !r.simulado);
  salvar(); viewHistorico();
}

function recarregarSimulacao() {
  if (!confirm('Carregar a simulação de 4 semanas? Registros reais na mesma data e serviço são mantidos.')) return;
  // garante que as preparações usadas pela simulação existam
  ITENS_PADRAO.forEach(p => { if (!estado.itens.some(i => i.id === p.id)) estado.itens.push({ ...p }); });
  estado.registros = estado.registros.filter(r => !r.simulado);
  gerarSimulacao().forEach(s => {
    if (!estado.registros.some(r => r.data === s.data && r.servico === s.servico)) estado.registros.push(s);
  });
  estado.registros.sort((a, b) => a.data.localeCompare(b.data));
  salvar(); viewHistorico();
}

function baixar(nome, conteudo, tipo) {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([conteudo], { type: tipo }));
  a.download = nome; a.click();
}
function exportarCSV() {
  const linhas = [['data','dia_semana','servico','refeicoes','preparacao','unidade','qtd_preparada','resultado','sobra_kg','atipico','simulacao','observacao']];
  estado.registros.forEach(r => Object.entries(r.itens).forEach(([id, v]) => {
    const it = estado.itens.find(i => i.id === id) || { nome: id, unidade: '' };
    linhas.push([r.data, DIAS[diaSemana(r.data)], r.servico, r.refeicoes, it.nome, it.unidade, v.qtd, ROTULO[v.res], v.kg ?? '', r.atipico ? 'sim' : 'nao', r.simulado ? 'sim' : 'nao', r.obs]);
  }));
  const csv = linhas.map(l => l.map(c => `"${String(c).replace(/"/g, '""')}"`).join(';')).join('\n');
  baixar('producao.csv', '\ufeff' + csv, 'text/csv;charset=utf-8');
}
function exportarJSON() { baixar('backup_producao.json', JSON.stringify(estado, null, 2), 'application/json'); }
function importarJSON(ev) {
  const f = ev.target.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    try {
      const s = JSON.parse(rd.result);
      if (!s.itens || !s.registros) throw new Error();
      if (!confirm('Isso substitui os dados atuais. Continuar?')) return;
      estado = s; salvar(); render();
    } catch (e) { alert('Arquivo inválido.'); }
  };
  rd.readAsText(f);
}

// ---------- Configurar ----------
function viewConfig() {
  $('view').innerHTML = `
    <div class="aviso">Comece com 3 a 5 preparações: as que mais sobram, custam mais ou aparecem com frequência. Se você remover uma, o histórico dela deixa de aparecer.</div>
    ${estado.itens.map(it => `
      <div class="card">
        <div class="row">
          <div><label>Preparação</label><input value="${esc(it.nome)}" onchange="edita('${it.id}','nome',this.value)"></div>
          <div><label>Unidade habitual</label><input value="${esc(it.unidade)}" onchange="edita('${it.id}','unidade',this.value)" placeholder="panela, bandeja, porção, kg"></div>
          <div><label>Margem de segurança (%)</label><input type="number" min="0" value="${it.margem}" onchange="edita('${it.id}','margem',num(this.value))"></div>
          <div><label>Arredondar para múltiplos de</label><input type="number" step="any" min="0.1" value="${it.passo}" onchange="edita('${it.id}','passo',num(this.value)||1)"></div>
        </div>
        <button class="del" style="margin-top:10px" onclick="removeItem('${it.id}')">Remover</button>
      </div>`).join('')}
    <button class="sec" onclick="addItem()">+ Adicionar preparação</button>
    <p class="mut" style="margin-top:16px">A margem pode variar por item: use maior para o que não dá para repor rápido ou cuja falta pesa mais, e menor para o que é caro ou perecível.</p>`;
}
function edita(id, campo, valor) {
  const it = estado.itens.find(i => i.id === id);
  if (it) { it[campo] = valor; salvar(); }
}
function addItem() {
  if (estado.itens.length >= 8) { alert('Para começar, mantenha poucas preparações (máximo de 8 aqui).'); return; }
  estado.itens.push({ id: 'i' + Date.now(), nome: 'Nova preparação', unidade: 'porção', margem: 10, passo: 1 });
  salvar(); viewConfig();
}
function removeItem(id) {
  if (!confirm('Remover esta preparação?')) return;
  estado.itens = estado.itens.filter(i => i.id !== id);
  salvar(); viewConfig();
}

render();
</script>
</body>
</html>
