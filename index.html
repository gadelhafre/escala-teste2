<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala</title>
<link rel="icon" href="data:,">
<style>
:root{
  --bg:#111418;--card:#1a1f26;--txt:#f2f4f7;--acc:#6ea8fe;--acc-esc:#0b0e0d;
  --erro:#ff8a7a;--aviso:#ffc15c;--fj:#3dd6c6;--extra:#d9a6ff;
  --borda:color-mix(in srgb,var(--txt) 16%,var(--card));
  --borda2:color-mix(in srgb,var(--txt) 9%,var(--card));
  --sup:color-mix(in srgb,var(--txt) 5%,var(--card));
  --mut:color-mix(in srgb,var(--txt) 62%,var(--bg));
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 20px;border-bottom:3px solid var(--acc);background:var(--card);position:sticky;top:0;z-index:5}
body.entrada .topo{display:none}
.marca{display:flex;align-items:center;gap:10px;min-width:0}
.marca strong{color:var(--acc);font-size:1.1rem}
.logo-topo{height:32px;max-width:130px;object-fit:contain}
.logo-entra{max-height:90px;max-width:220px;object-fit:contain}
#usuario{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 10px;color:var(--acc);font-weight:600}
.card h2{font-size:1.15rem}.card h3{font-size:1rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:8px 14px}
button:hover:not(:disabled){background:color-mix(in srgb,var(--acc) 14%,transparent)}
button.cheio{background:var(--acc);color:var(--acc-esc);font-weight:700}
button.perigo{border-color:var(--erro);color:var(--erro)}
button.aviso{border-color:var(--aviso);color:var(--aviso)}
button.pq{padding:3px 9px;font-size:.85rem}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;background:var(--bg);color:var(--txt);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;width:100%}
input[type=color]{padding:2px;height:42px;cursor:pointer}
input:focus,select:focus,textarea:focus,button:focus-visible,td.clic:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=checkbox]{width:auto}
input[type=file]{padding:8px}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.9rem}
.sutil{color:var(--mut);font-size:.9rem}
.pequeno{font-size:.9rem}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;border:1px solid var(--mut);color:var(--mut);white-space:nowrap;margin-left:4px}
.badge.ok{border-color:var(--acc);color:var(--acc)}
.badge.warn{border-color:var(--aviso);color:var(--aviso)}
.badge.bad{border-color:var(--erro);color:var(--erro)}
.abas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
.abas button{border-color:var(--borda);color:var(--txt)}
.abas button.ativa{background:var(--acc);color:var(--acc-esc);border-color:var(--acc);font-weight:600}
.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.msg{border-left:3px solid var(--aviso);padding:6px 10px;margin:8px 0;background:var(--sup);border-radius:0 8px 8px 0}
.msg.erro{border-color:var(--erro)}
.msg.info{border-color:var(--fj)}
.msg.proj{border-color:var(--extra)}
.msg ul{margin:4px 0;padding-left:20px}
.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.dia{border:1px solid var(--borda2);border-radius:12px;padding:8px 2px;text-align:center;background:var(--sup);min-width:0;overflow:hidden;font-size:.9rem}
.dia b,.dia small,.dia .t{display:block}.dia small{color:var(--mut)}
.dia .fer{display:block;font-size:.65rem;color:var(--aviso)}
.dia.escolha{cursor:pointer}
.dia.sel{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 25%,transparent)}
.dia.sel .t{color:var(--acc);font-weight:700}
.dia.travado{opacity:.45;cursor:not-allowed}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.cal-cab{text-align:center;font-size:.78rem;color:var(--mut)}
.cal-dia{min-width:0;min-height:62px;border:1px solid var(--borda2);border-radius:10px;padding:5px 3px;background:var(--sup);display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.cal-dia .t{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--acc)}
.cal-dia .fer{font-size:.6rem;color:var(--aviso);text-align:center;line-height:1.1}
.cal-dia.st-F{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 15%,transparent)}
.cal-dia.st-FJ{border-color:var(--fj);background:color-mix(in srgb,var(--fj) 14%,transparent)}.cal-dia.st-FJ .t{color:var(--fj)}
.cal-dia.st-FI{border-color:var(--erro);background:color-mix(in srgb,var(--erro) 14%,transparent)}.cal-dia.st-FI .t{color:var(--erro)}
.cal-dia.st-EX{border-color:var(--extra);background:color-mix(in srgb,var(--extra) 14%,transparent)}.cal-dia.st-EX .t{color:var(--extra)}
.cal-dia.prev{border-style:dashed}
.cal-dia.hoje{outline:2px dashed var(--aviso);outline-offset:-1px}
.cal-dia.fora{opacity:.2;background:transparent}
.nav-mes{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
.nav-mes h3{margin:0;color:var(--txt)}
.nav-sem{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
.nav-sem input{width:auto}
.legenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--mut);margin-bottom:10px}
.legenda i{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:6px;vertical-align:middle}
.l-folga{background:color-mix(in srgb,var(--acc) 18%,transparent);border:1px solid var(--acc)}
.l-prev{border:1px dashed var(--acc)}
.l-hoje{border:2px dashed var(--aviso)}
.l-fj{background:color-mix(in srgb,var(--fj) 22%,transparent);border:1px solid var(--fj)}
.l-fi{background:color-mix(in srgb,var(--erro) 22%,transparent);border:1px solid var(--erro)}
.l-ex{background:color-mix(in srgb,var(--extra) 22%,transparent);border:1px solid var(--extra)}
.l-alt{border:2px solid var(--aviso)}
.linha-semana{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--borda2)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 5px;border-bottom:1px solid var(--borda2);text-align:center;vertical-align:top}
th:first-child,td:first-child{text-align:left}
td.clic{cursor:pointer;user-select:none}
td.clic:hover{background:color-mix(in srgb,var(--txt) 9%,transparent)}
td.f{background:color-mix(in srgb,var(--acc) 17%,transparent);color:var(--acc);font-weight:700}
td.w{font-size:.8rem}
td.fj{background:color-mix(in srgb,var(--fj) 16%,transparent);color:var(--fj);font-weight:700}
td.fi{background:color-mix(in srgb,var(--erro) 18%,transparent);color:var(--erro);font-weight:700}
td.ex{background:color-mix(in srgb,var(--extra) 16%,transparent);color:var(--extra);font-weight:700}
td.alt{box-shadow:inset 0 0 0 2px var(--aviso)}
td.def{color:var(--erro);font-weight:700}
td.grupo{color:var(--acc);text-align:left;font-weight:600}
.hor{display:block;font-size:.7rem;font-weight:400;color:var(--txt)}
.sem-reg{display:block;font-size:.65rem;font-weight:400;color:var(--aviso)}
.obs-m{color:var(--aviso);font-size:.65rem;margin-left:3px}
.rolagem{overflow-x:auto}
.pedido{border:1px solid var(--borda2);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--sup)}
.pedido.urg{border-color:var(--erro)}
.alerta{border:2px solid var(--erro);background:color-mix(in srgb,var(--erro) 8%,transparent);border-radius:14px;padding:14px;margin-bottom:16px}
.grade2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
.grade3{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
ul.limpa{list-style:none;margin:0;padding:0}ul.limpa li{padding:5px 0;border-bottom:1px solid var(--borda2)}
.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:8px;margin:10px 0}
.sbtn{padding:10px 6px;border:1px solid var(--borda);color:var(--txt);text-align:center}
.sbtn b{display:block}.sbtn small{display:block;color:var(--mut);font-size:.7rem}
.sbtn.on{font-weight:700}
.sbtn.on.s-T{border-color:var(--txt);background:color-mix(in srgb,var(--txt) 12%,transparent)}
.sbtn.on.s-F{border-color:var(--acc);background:color-mix(in srgb,var(--acc) 22%,transparent);color:var(--acc)}
.sbtn.on.s-FJ{border-color:var(--fj);background:color-mix(in srgb,var(--fj) 22%,transparent);color:var(--fj)}
.sbtn.on.s-FI{border-color:var(--erro);background:color-mix(in srgb,var(--erro) 22%,transparent);color:var(--erro)}
.sbtn.on.s-EX{border-color:var(--extra);background:color-mix(in srgb,var(--extra) 22%,transparent);color:var(--extra)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.modal[hidden]{display:none}
.modal-box{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:18px;max-width:600px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--card);border:1px solid var(--acc);color:var(--acc);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.show{opacity:1}#toast.erro{background:var(--erro);border-color:var(--erro);color:#0e1110}
.entra{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 0}
.entra h1{margin:0;color:var(--acc);font-size:1.6rem;text-align:center}
.entra-card{width:min(400px,100%);display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--borda);border-radius:20px;padding:24px}
.demo{width:min(400px,100%)}
.demo button{margin:3px 4px 0 0}
.preview-logo{max-height:80px;max-width:240px;object-fit:contain;display:block;margin:6px 0;padding:8px;border:1px dashed var(--borda);border-radius:10px;background:var(--bg)}
.cor-item label{margin-top:0}
@media (max-width:640px){main{padding:10px}.cal{gap:3px}.cal-dia{min-height:52px}.cal-dia .fer{display:none}.cal-dia .t{font-size:.58rem}.dia{font-size:.78rem}}
</style>
</head>
<body>
<header class="topo"><span class="marca" id="marca"></span><span id="usuario"></span></header>
<main id="app"></main>
<div id="modal" class="modal" hidden><div id="modalBox" class="modal-box"></div></div>
<div id="toast"></div>

<script>
'use strict';
// ===== FIM DA PARTE 1 =====
  // =====================================================================
//  CONFIGURAÇÃO INICIAL  (é aqui que você personaliza cada cliente)
//  Vale só na primeira abertura do site em um navegador (ou ao reiniciar).
//  Depois disso, tudo também pode ser mudado dentro do site.
// =====================================================================
const TEMAS = {
  neutro: { nome: 'Neutro escuro', cores: { acc: '#6ea8fe', bg: '#111418', card: '#1a1f26', txt: '#f2f4f7', fj: '#3dd6c6', erro: '#ff8a7a', aviso: '#ffc15c', extra: '#d9a6ff' } },
  verde:  { nome: 'Verde escuro',  cores: { acc: '#5ad2aa', bg: '#0e1110', card: '#161b19', txt: '#f4f7f5', fj: '#7cc4ff', erro: '#ff8a7a', aviso: '#ffc15c', extra: '#d9a6ff' } },
  quente: { nome: 'Quente escuro', cores: { acc: '#e0a458', bg: '#14100e', card: '#1f1815', txt: '#f6efe9', fj: '#6fd3c9', erro: '#ff8a7a', aviso: '#ffd27a', extra: '#d9a6ff' } },
  claro:  { nome: 'Claro',         cores: { acc: '#1f6feb', bg: '#f3f5f8', card: '#ffffff', txt: '#1a2230', fj: '#0e7490', erro: '#d1242f', aviso: '#b7791f', extra: '#7e22ce' } }
};

const CONFIG_INICIAL = {
  armazenamento: 'escala_base_v1',          // nome do "cofre" no navegador (use um diferente por cliente se publicar no mesmo endereço)
  contasDemonstracao: true,                  // true mostra botões de login de teste na tela de entrada
  marca: { nome: 'Minha Empresa', subtitulo: 'Escala de folgas 5x2', logo: '', cores: TEMAS.neutro.cores },
  equipes: [ { id: 'e1', nome: 'Equipe A' }, { id: 'e2', nome: 'Equipe B' }, { id: 'e3', nome: 'Equipe C' } ],
  // mínimo de pessoas trabalhando por dia, na ordem Seg, Ter, Qua, Qui, Sex, Sáb, Dom
  minimos: { e1: [2, 2, 2, 2, 3, 3, 3], e2: [2, 2, 2, 2, 3, 3, 3], e3: [1, 1, 1, 1, 1, 1, 1] },
  // dias: 0 = segunda ... 6 = domingo. "off" (0 a 3) define quando cada pessoa folga no domingo.
  pessoas: [
    { nome: 'Gestor Demo',    cpf: '900.000.000-01', equipe: 'e1', gestor: true },
    { nome: 'Colaborador A1', cpf: '100.000.000-01', equipe: 'e1', base: [0, 1], off: 0, ent: '09:00', sai: '18:00', int: 60 },
    { nome: 'Colaborador A2', cpf: '100.000.000-02', equipe: 'e1', base: [1, 2], off: 1, ent: '09:00', sai: '18:00', int: 60 },
    { nome: 'Colaborador A3', cpf: '100.000.000-03', equipe: 'e1', base: [2, 3], off: 2, ent: '09:00', sai: '18:00', int: 60 },
    { nome: 'Colaborador A4', cpf: '100.000.000-04', equipe: 'e1', base: [0, 3], off: 3, ent: '09:00', sai: '18:00', int: 60 },
    { nome: 'Colaborador B1', cpf: '200.000.000-01', equipe: 'e2', base: [0, 1], off: 0, ent: '15:00', sai: '00:00', int: 60 },
    { nome: 'Colaborador B2', cpf: '200.000.000-02', equipe: 'e2', base: [1, 2], off: 1, ent: '15:00', sai: '00:00', int: 60 },
    { nome: 'Colaborador B3', cpf: '200.000.000-03', equipe: 'e2', base: [2, 3], off: 2, ent: '15:00', sai: '00:00', int: 60 },
    { nome: 'Colaborador B4', cpf: '200.000.000-04', equipe: 'e2', base: [0, 3], off: 3, ent: '15:00', sai: '00:00', int: 60 },
    { nome: 'Colaborador C1', cpf: '300.000.000-01', equipe: 'e3', base: [0, 1], off: 0, ent: '08:00', sai: '17:00', int: 60 },
    { nome: 'Colaborador C2', cpf: '300.000.000-02', equipe: 'e3', base: [2, 3], off: 2, ent: '08:00', sai: '17:00', int: 60 }
  ],
  params: { cctNome: 'Informe aqui a convenção coletiva ou o acordo da empresa', folgasSemana: 2, maxSeguidos: 6, horasDia: 8,
    limiteAtual: 44, limiteApos1: 42, limiteApos2: 40, dataEmenda: '2026-12-16', dataLimite40: '2027-12-16',
    domingoACadaDias: 30, feriadoCompDias: 15 }
};

const CHAVE = CONFIG_INICIAL.armazenamento;
const SESSAO = 'escala_sessao';
const SAL = 'escala-base|';
// COMPATIBILIDADE (pode apagar as 3 linhas abaixo e o que usa SAL_ANTIGO/CHAVE_ANTIGA numa versão limpa):
// permite abrir dados salvos por uma versão anterior deste site neste mesmo navegador.
const SAL_ANTIGO = 'quintal-escala|';
const CHAVE_ANTIGA = 'quintal_escala_v1';

const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DIAS_L = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CATEGORIAS = ['Saúde / consulta','Família','Estudo','Transporte','Compromisso pessoal','Outro'];
const ST_REGRA = { lei:'lei', cct:'CCT', sistema:'regra do sistema', confirmar:'confirmar' };
const CORES_ROTULOS = [
  ['acc','Destaque (botões, títulos, folga)'], ['bg','Fundo da página'], ['card','Fundo dos cartões'], ['txt','Texto'],
  ['fj','Falta justificada (F.J)'], ['erro','Alertas e falta injustificada (F.INJ)'], ['aviso','Avisos e feriados'], ['extra','Dia extra']
];

// Tipos de dia. "trabalha" = conta na cobertura e na carga semanal.
const STATUS = {
  T:  { sigla:'trabalho', desc:'dia normal',          nome:'Trabalho',             cls:'w'  },
  F:  { sigla:'folga',    desc:'repouso',             nome:'Folga',                cls:'f'  },
  FJ: { sigla:'F.J',      desc:'falta justificada',   nome:'Falta justificada',    cls:'fj' },
  FI: { sigla:'F.INJ',    desc:'falta injustificada', nome:'Falta injustificada',  cls:'fi' },
  EX: { sigla:'EXTRA',    desc:'dia extra',           nome:'Dia extra',            cls:'ex' }
};
const ROT_CAL = { F:'folga', FJ:'F.J', FI:'F.INJ', EX:'extra' };
const MOTIVOS_FJ = [
  'Atestado médico ou odontológico', 'Falecimento de familiar', 'Casamento', 'Nascimento de filho', 'Doação de sangue',
  'Alistamento ou serviço militar', 'Internação de cônjuge ou filho', 'Acompanhar filho menor de 12 anos ao médico',
  'Prova escolar, vestibular ou ENEM', 'Outro motivo abonado'
];
const trabalha = s => s === 'T' || s === 'EX';

const app = document.getElementById('app');
const usuario = document.getElementById('usuario');

let estado = null;
let semanaGestor = '';
let abaGestor = 'pedidos';
let mesFunc = 0;
let projAtiva = '';
let mesResumo = '';

// ---------- utilidades ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => new Date(s + 'T12:00:00');
const addDias = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDias = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);
const dowM = s => (parse(s).getDay() + 6) % 7;            // 0 = segunda ... 6 = domingo
const iniSemana = s => addDias(s, -dowM(s));
const hojeISO = () => iso(new Date());
const dataBR = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const dataBRfull = s => dataBR(s) + '/' + s.slice(0, 4);
const idxSemana = ws => Math.round((parse(ws) - parse('2024-01-01')) / (7 * 86400000));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const stamp = () => { const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parTxt = p => (p && p.length) ? p.map(i => DIAS_L[i]).join(' e ') : '—';
const clonar = o => JSON.parse(JSON.stringify(o));
const funcionario = id => estado.funcionarios.find(f => f.id === id);
const feriadoDe = data => { const x = estado.feriados.find(f => f.data === data); return x ? x.nome : ''; };
const equipeDe = funcao => estado.funcionarios.filter(f => !f.gestor && f.funcao === funcao);
const idsFuncoes = () => estado.funcoes.map(x => x.id);
const nomeEq = id => { const x = estado.funcoes.find(y => y.id === id); return x ? x.nome : '(sem equipe)'; };
const normNome = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
async function hashCPF(cpf, sal) {
  const d = cpf.replace(/\D/g, '');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode((sal || SAL) + d));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function salvar() { localStorage.setItem(CHAVE, JSON.stringify(estado)); }
function logar(txt) { estado.log.unshift({ t: stamp(), texto: txt }); estado.log = estado.log.slice(0, 300); }
const quemSou = () => { const f = funcionario(sessionStorage.getItem(SESSAO)); return f ? f.nome : ''; };

// ---------- identidade visual ----------
const contraste = hex => {
  const n = parseInt(String(hex).replace('#', ''), 16) || 0;

function lerLogo(file, cb) {

const minDe = t => (typeof t === 'string' && /^\d{2}:\d{2}$/.test(t)) ? (+t.slice(0, 2)) * 60 + (+t.slice(3)) : null;
function minBruto(e) {
  if (!e) return null;
  const a = minDe(e.ent), b = minDe(e.sai);
  if (a == null || b == null) return null;
  let d = b - a; if (d < 0) d += 1440;
  return d;
}
function minTrab(e) { const b = minBruto(e); return b == null ? null : Math.max(0, b - (+e.int || 0)); }
const fmtH = m => m == null ? '—' : Math.floor(m / 60) + 'h' + (m % 60 ? pad(m % 60) : '');
const fmtSaldo = m => m === 0 ? '0h' : (m > 0 ? '+' : '−') + fmtH(Math.abs(m));
const horarioTurno = turno => turno === 'Manhã/Tarde' ? ['08:00', '17:00', 60] : turno === 'Tarde/Noite' ? ['15:00', '00:00', 60] : ['09:00', '18:00', 60];
const horarioPadrao = f => (f.hEnt || '—') + '–' + (f.hSai || '—');
function gapJornadas(pe, ne) {
  const a = minDe(pe && pe.ent), b = minDe(pe && pe.sai), c = minDe(ne && ne.ent);
  if (a == null || b == null || c == null) return null;
  return 1440 + c - (b < a ? b + 1440 : b);
}
function avisosHorario(f, data, hv, L) {
  const av = [];
  if (!hv.ent && !hv.sai) return av;
  if (!hv.ent || !hv.sai) { av.push('Falta preencher ' + (hv.ent ? 'a saída' : 'a entrada') + '.'); return av; }
  const bruto = minBruto(hv), m = minTrab(hv), it = +hv.int || 0;
  if (bruto === 0) av.push('Entrada e saída iguais.');
  if (m != null && m > 600) av.push('Jornada de ' + fmtH(m) + ' no dia: acima de 10 h (regra geral da CLT, art. 59, admite no máximo 2 h extras por dia; conferir a convenção).');
  if (bruto > 360 && it < 60) av.push('Jornada acima de 6 h normalmente pede intervalo de ao menos 1 h (regra geral da CLT, art. 71; conferir se a convenção prevê outra regra).');
  else if (bruto > 240 && bruto <= 360 && it < 15) av.push('Jornada entre 4 h e 6 h normalmente pede intervalo de ao menos 15 min (CLT, art. 71).');
  const prev = L[addDias(data, -1) + '|' + f.id], next = L[addDias(data, 1) + '|' + f.id];
  const g1 = gapJornadas(prev, hv), g2 = gapJornadas(hv, next);
  if (g1 != null && g1 < 660) av.push('Só ' + fmtH(g1) + ' entre a saída de ontem e a entrada de hoje (descanso entre jornadas: 11 h, CLT art. 66; conferir a convenção).');
  if (g2 != null && g2 < 660) av.push('Só ' + fmtH(g2) + ' entre a saída de hoje e a entrada de amanhã (descanso entre jornadas: 11 h, CLT art. 66; conferir a convenção).');
  return av;
}

// ---------- motor de escala ----------
function padraoPar(f, ws) {
  if (!f.base || !f.base.length) return [];
  if (estado.params.domingoACadaDias > 0 && (((idxSemana(ws) + f.off) % 4) + 4) % 4 === 0 && !f.base.includes(6))
    return [f.base[0], 6].sort((a, b) => a - b);
  return f.base.slice();
}
const padrao = (f, data) => padraoPar(f, iniSemana(data)).includes(dowM(data)) ? 'F' : 'T';
// Cada dia pode ter uma entrada própria: { s, obs, motivo, ent, sai, int, auto, por, em }
const entrada = (f, data, ov) => (ov || estado.dias)[data + '|' + f.id];
function statusDia(f, data, ov) { const e = entrada(f, data, ov); return e ? e.s : padrao(f, data); }
function parDe(f, ws, ov) { const r = []; for (let d = 0; d < 7; d++) if (statusDia(f, addDias(ws, d), ov) === 'F') r.push(d); return r; }
function comPar(f, ws, par, ov) {
  const base = ov || estado.dias, r = Object.assign({}, base);
  for (let d = 0; d < 7; d++) {
    const data = addDias(ws, d), k = data + '|' + f.id, cur = statusDia(f, data, base), old = base[k];
    if (par.includes(d)) { if (cur !== 'F') r[k] = { s: 'F', obs: (old && old.obs) || '' }; }
    else if (cur === 'F') r[k] = { s: 'T', obs: (old && old.obs) || '' };
  }
  return r;
}
function registrarPassado() {

  while (ws < hoje) {

      for (let d = 0; d < 7; d++) {
        const data = addDias(ws, d), k = data + '|' + f.id;
        if (!estado.dias[k]) estado.dias[k] = { s: padrao(f, data), obs: '', auto: true };

  }
  if (mudou) salvar();
}
function maxSeguidos(f, ws, ov) {
  let max = 0, run = 0;
  for (let n = -7; n < 21; n++) { if (trabalha(statusDia(f, addDias(ws, n), ov))) { run++; if (run > max) max = run; } else run = 0; }
  return max;
}
function diasSemDomingo(f, ref, ov) {
  let d = addDias(iniSemana(ref), 6); if (d > ref) d = addDias(d, -7);
  for (let k = 0; k < 12; k++) { if (statusDia(f, d, ov) === 'F') return diffDias(ref, d); d = addDias(d, -7); }
  return 999;
}
function limiteEm(ws) {

}
function cobertura(funcao, ws, ov) {
  const eq = equipeDe(funcao);

}
function furos(funcao, ws, ov) {
  const c = cobertura(funcao, ws, ov), m = estado.minimos[funcao] || [];
  const r = []; c.forEach((v, d) => { if (v < (m[d] || 0)) r.push({ dia: d, falta: m[d] - v }); });
  return r;
}
const totalFalta = arr => arr.reduce((a, x) => a + x.falta, 0);

function validar(f, ws, par, ov) {
  const p = estado.params, m = [];
  if (par.length !== p.folgasSemana) m.push('A semana precisa ter exatamente ' + p.folgasSemana + ' folgas.');
  const ms = maxSeguidos(f, ws, comPar(f, ws, par, ov));
  if (ms > p.maxSeguidos) m.push('Isso deixaria ' + ms + ' dias seguidos de trabalho (máximo ' + p.maxSeguidos + ').');

}
function avisosDe(f, ws, tmp) {

  if (p.domingoACadaDias > 0) {

    if (sd > p.domingoACadaDias) a.push('Ficaria ' + (sd >= 999 ? 'muito tempo' : sd + ' dias') + ' sem folga em domingo (referência: 1 a cada ' + p.domingoACadaDias + ' dias; regra a confirmar).');
  }

function sugerir(funcao, ws, ov, ignorarId) {
  ov = ov || estado.dias;
  const hoje = hojeISO(); let trabalho = Object.assign({}, ov); const sug = [];
  const antes = furos(funcao, ws, ov);
  for (let guard = 0; guard < 12; guard++) {
    const fs = furos(funcao, ws, trabalho); if (!fs.length) break;
    const fur = fs[0]; let achou = false;
    for (const f of equipeDe(funcao)) {
      if (achou) break;

      const par = parDe(f, ws, trabalho);
      if (!par.includes(fur.dia) || addDias(ws, fur.dia) < hoje) continue;
      for (let d2 = 0; d2 < 7; d2++) {
        const dt2 = addDias(ws, d2);
        if (dt2 < hoje || statusDia(f, dt2, trabalho) !== 'T') continue;

        if (validar(f, ws, novo, trabalho).length) continue;
        const t2 = comPar(f, ws, novo, trabalho);

        trabalho = t2; achou = true;

        break;

function aplicarMudanca(f, ws, par, remanejo, motivo, ov) {

}
function auditar(f, ws, ov) {

function resumoMes(f, ym, L) {

function analisarDia(f, data, s, L) {

    if (c < mn) avisos.push('Cobertura de ' + nomeEq(f.funcao) + ' em ' + DIAS_L[dow] + ' ficaria em ' + c + '/' + mn + '.');
    avisosDe(f, ws, tmp).forEach(x => { if (!avisos.includes(x)) avisos.push(x); });
  }
  if (s === 'FJ') {

    infos.push('Não conta na cobertura nem na carga semanal.');
  }
  if (s === 'EX') {

    else if (pd === 'F') avisos.push('Folga semanal trabalhada: pagar em dobro ou dar outra folga na mesma semana (confirmar com o sindicato ou contador).');
    if (pd === 'T') infos.push('Este dia já era de trabalho na escala. Use Extra para dias além da escala; horas acima da jornada seguem a regra de hora extra.');
    infos.push('Conta na cobertura e na carga semanal.');
  }
  if (s === 'T' && pd === 'F') infos.push('Trabalho no lugar da folga: a folga deste dia é perdida. Se for um dia a mais, e não uma troca, use Extra.');
  if (s === 'F' && pd === 'T') infos.push('Folga em um dia que era de trabalho.');

}

function seletorDias(f, ws, parInicial, aoMudar) {

  const box = h('div', { class: 'semana' });

    if (bCpf.value.length !== 11) return toast('Informe o CPF com 11 dígitos.', true);
    if (!confirm('Isso APAGA todos os dados deste navegador (escalas, pessoas, projeções, regras) e começa uma empresa em branco. Continuar?')) return;
    await criarEstadoVazio(bEmp.value.trim(), bNome.value.trim(), bCpf.value);
    projAtiva = ''; semanaGestor = ''; abaGestor = 'equipe';
    sessionStorage.setItem(SESSAO, 'f1'); toast('Empresa em branco criada.'); iniciar();
  };
  const reiniciar = async () => {
    if (!confirm('Isso APAGA todos os dados deste navegador e volta aos dados de exemplo do bloco CONFIG_INICIAL. Continuar?')) return;
    await criarEstadoInicial();
    projAtiva = ''; semanaGestor = ''; abaGestor = 'pedidos';
    sessionStorage.removeItem(SESSAO); toast('Dados de exemplo restaurados.'); telaEntrada();
  };
  return h('div', {},
    h('div', { class: 'card' }, h('h2', {}, 'Identidade'),
      h('p', { class: 'sutil pequeno' }, 'Nome, logo e cores que aparecem no site para todos os usuários deste navegador.'),
      h('label', {}, 'Nome da empresa'), nome, h('label', {}, 'Subtítulo (tela de entrada)'), sub,
      h('label', {}, 'Logo (PNG, JPG ou SVG; é reduzida automaticamente)'), m.logo ? h('img', { class: 'preview-logo', src: m.logo, alt: 'Logo atual' }) : h('p', { class: 'sutil pequeno' }, 'Nenhuma logo definida.'),
      arq,
      m.logo ? h('div', { class: 'acoes' }, h('button', { class: 'pq perigo', onclick: () => { m.logo = ''; salvar(); aplicarTema(); painelGestor(); } }, 'Remover logo')) : null),
    h('div', { class: 'card' }, h('h3', {}, 'Cores'),
      h('p', { class: 'sutil pequeno' }, 'Comece por um tema pronto e ajuste as cores que quiser.'),
      h('div', { class: 'acoes' }, temas), h('div', { class: 'grade3', style: 'margin-top:10px' }, cores)),
    h('div', { class: 'card' }, h('h3', {}, 'Tela de entrada'),
      h('label', { style: 'display:flex;gap:6px;align-items:center' }, demoCk, 'Mostrar botões de contas de demonstração (desmarque antes de entregar ao cliente)')),
    h('div', { class: 'card' }, h('h3', {}, 'Começar uma empresa em branco'),
      h('p', { class: 'sutil pequeno' }, 'Apaga os dados deste navegador e cria só um gestor, sem equipes preenchidas. Importante: este protótipo guarda tudo apenas neste navegador e não tem servidor; para uso real com CPFs verdadeiros é preciso um sistema com banco de dados e login seguro.'),
      h('div', { class: 'grade2' }, h('div', {}, bEmp), h('div', {}, bNome), h('div', {}, bCpf)),
      h('div', { class: 'acoes' }, h('button', { class: 'pq perigo', onclick: criarBranco }, 'Criar empresa em branco'),
        h('button', { class: 'pq perigo', onclick: reiniciar }, 'Voltar aos dados de exemplo'))));
}

// ----- registro e backup -----
function lerBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let o;
    try {
      o = JSON.parse(rd.result);
      if (!o || !Array.isArray(o.funcionarios) || !Array.isArray(o.funcoes) || !o.funcionarios.some(x => x.gestor)) throw new Error('inválido');
    } catch (e) { toast('Arquivo de backup inválido.', true); return; }
    if (!confirm('Restaurar este backup? Os dados atuais deste navegador serão substituídos.')) return;
    projAtiva = ''; semanaGestor = '';
    migrar(o); logar('Backup restaurado.'); salvar(); toast('Backup restaurado.'); iniciar();
  };
  rd.onerror = () => toast('Não consegui ler o arquivo.', true);
  rd.readAsText(file);
}
function gLog() {
  const arq = h('input', { type: 'file', accept: '.json,application/json', onchange: e => {
    const file = e.target.files && e.target.files[0]; if (file) lerBackup(file); } });
  return h('div', {},
    h('div', { class: 'card' }, h('h2', {}, 'Backup e exportação'),
      h('p', { class: 'sutil pequeno' }, 'Os dados ficam só neste navegador e neste aparelho. Baixe um backup com frequência e use-o para levar os dados a outro aparelho.'),
      h('div', { class: 'acoes' },
        h('button', { class: 'pq', onclick: () => { baixar('backup_escala_' + hojeISO() + '.json', JSON.stringify(estado), 'application/json'); toast('Backup baixado.'); } }, 'Baixar backup (JSON)'),
        h('button', { class: 'pq', onclick: () => csvHorarios('') }, 'Baixar todos os horários (CSV)')),
      h('label', {}, 'Restaurar backup (arquivo .json)'), arq),
    h('div', { class: 'card' }, h('h2', {}, 'Registro de alterações'),
      h('p', { class: 'sutil pequeno' }, 'As últimas alterações feitas no sistema (guarda até 300).'),
      estado.log.length ? h('ul', { class: 'limpa' }, estado.log.slice(0, 80).map(x => h('li', {}, h('span', { class: 'sutil' }, x.t + ' · '), x.texto)))
        : h('p', { class: 'sutil' }, 'Nada registrado ainda.')));
}

// ---------- início ----------
(async function () {
  let bruto = localStorage.getItem(CHAVE);
  if (!bruto) bruto = localStorage.getItem(CHAVE_ANTIGA);
  if (bruto) {
    try { migrar(JSON.parse(bruto)); }
    catch (e) { bruto = null; }
  }
  if (!bruto) await criarEstadoInicial();
  iniciar();
})();
</script>
