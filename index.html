<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Escala 5x2 · Quintal do Carmo</title>
<style>
:root{--bg:#0e1110;--card:#161b19;--borda:#2b3330;--borda2:#222a27;--acc:#5ad2aa;--acc-esc:#07120e;--txt:#f4f7f5;--mut:#9aa8a2;--erro:#ff8a7a;--aviso:#ffc15c;--sup:#1b211f}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:16px/1.45 system-ui,Segoe UI,Roboto,sans-serif;min-height:100vh}
.topo{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 20px;border-bottom:3px solid var(--acc);background:#080a09;position:sticky;top:0;z-index:5}
body.entrada .topo{display:none}
.topo strong{color:var(--acc);font-size:1.1rem}
#usuario{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end}
main{max-width:1100px;margin:0 auto;padding:18px}
.card{background:var(--card);border:1px solid var(--borda);border-radius:14px;padding:16px;margin-bottom:16px}
.card h2,.card h3{margin:0 0 10px;color:var(--acc);font-weight:600}
.card h2{font-size:1.15rem}.card h3{font-size:1rem}
button{font:inherit;cursor:pointer;border-radius:10px;border:1px solid var(--acc);background:transparent;color:var(--acc);padding:8px 14px}
button:hover:not(:disabled){background:rgba(90,210,170,.14)}
button.cheio{background:var(--acc);color:var(--acc-esc);font-weight:700}
button.perigo{border-color:var(--erro);color:var(--erro)}
button.aviso{border-color:var(--aviso);color:var(--aviso)}
button.pq{padding:3px 9px;font-size:.85rem}
button:disabled{opacity:.4;cursor:not-allowed}
input,select,textarea{font:inherit;background:#0b0e0d;color:var(--txt);border:1px solid var(--borda);border-radius:10px;padding:10px 12px;width:100%}
input:focus,select:focus,textarea:focus,button:focus-visible{outline:2px solid var(--acc);outline-offset:1px}
input[type=checkbox]{width:auto}
label{display:block;margin:10px 0 4px;color:var(--mut);font-size:.9rem}
.sutil{color:var(--mut);font-size:.9rem}
.pequeno{font-size:.9rem}
.badge{display:inline-block;border-radius:999px;padding:2px 10px;font-size:.78rem;border:1px solid var(--mut);color:var(--mut);white-space:nowrap}
.badge.ok{border-color:var(--acc);color:var(--acc)}

.acoes{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.msg{border-left:3px solid var(--aviso);padding:6px 10px;margin:8px 0;background:var(--sup);border-radius:0 8px 8px 0}

.semana{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.dia{border:1px solid var(--borda2);border-radius:12px;padding:8px 2px;text-align:center;background:var(--sup);min-width:0;overflow:hidden;font-size:.9rem}

.dia .fer{display:block;font-size:.65rem;color:var(--aviso)}
.dia.escolha{cursor:pointer}
.dia.sel{border-color:var(--acc);background:rgba(90,210,170,.25)}
.dia.sel .t{color:var(--acc);font-weight:700}

.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px}
.cal-cab{text-align:center;font-size:.78rem;color:var(--mut)}
.cal-dia{min-width:0;min-height:62px;border:1px solid var(--borda2);border-radius:10px;padding:5px 3px;background:var(--sup);display:flex;flex-direction:column;align-items:center;gap:2px;overflow:hidden}
.cal-dia .t{font-size:.7rem;font-weight:700;text-transform:uppercase;color:var(--acc)}
.cal-dia .fer{font-size:.6rem;color:var(--aviso);text-align:center;line-height:1.1}
.cal-dia.folga{border-color:var(--acc);background:rgba(90,210,170,.15)}
.cal-dia.prev{border-style:dashed}
.cal-dia.prev.folga{background:rgba(90,210,170,.06)}
.cal-dia.hoje{outline:2px dashed var(--aviso);outline-offset:-1px}
.cal-dia.fora{opacity:.2;background:transparent}
.nav-mes{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:6px 0 10px}
.nav-mes h3{margin:0;color:var(--txt)}
.legenda{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:.85rem;color:var(--mut);margin-bottom:10px}
.legenda i{display:inline-block;width:16px;height:16px;border-radius:5px;margin-right:6px;vertical-align:middle}
.l-folga{background:rgba(90,210,170,.15);border:1px solid var(--acc)}
.l-prev{border:1px dashed var(--acc)}
.l-hoje{border:2px dashed var(--aviso)}
.linha-semana{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:12px 0;border-top:1px solid var(--borda2)}
table{width:100%;border-collapse:collapse;font-size:.88rem}
th,td{padding:6px 5px;border-bottom:1px solid var(--borda2);text-align:center;vertical-align:top}
th:first-child,td:first-child{text-align:left}
td.f{background:rgba(90,210,170,.17);color:var(--acc);font-weight:700}
td.w{color:#c9d3cf;font-size:.8rem}
td.alt{box-shadow:inset 0 0 0 2px var(--aviso)}
td.def{color:var(--erro);font-weight:700}
td.grupo{color:var(--acc);text-align:left;font-weight:600}
.rolagem{overflow-x:auto}
.pedido{border:1px solid var(--borda2);border-radius:12px;padding:12px;margin-bottom:10px;background:var(--sup)}
.pedido.urg{border-color:var(--erro)}
.alerta{border:2px solid var(--erro);background:rgba(255,122,107,.08);border-radius:14px;padding:14px;margin-bottom:16px}
.grade2{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(220px,1fr))}
ul.limpa{list-style:none;margin:0;padding:0}ul.limpa li{padding:5px 0;border-bottom:1px solid var(--borda2)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:center;justify-content:center;z-index:20;padding:14px}
.modal[hidden]{display:none}
.modal-box{background:var(--card);border:1px solid var(--borda);border-radius:16px;padding:18px;max-width:560px;width:100%;max-height:90vh;overflow:auto}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#080a09;border:1px solid var(--acc);color:var(--acc);padding:10px 18px;border-radius:12px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30;max-width:90vw}
#toast.show{opacity:1}#toast.erro{background:var(--erro);border-color:var(--erro);color:#0e1110}
.entra{min-height:90vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px 0}

.entra-card{width:min(400px,100%);display:flex;flex-direction:column;gap:12px;background:var(--card);border:1px solid var(--borda);border-radius:20px;padding:24px}

@media (max-width:640px){main{padding:10px}.cal{gap:3px}.cal-dia{min-height:52px}.cal-dia .fer{display:none}.cal-dia .t{font-size:.58rem}.dia{font-size:.78rem}}

<body>
<header class="topo"><strong>Quintal do Carmo · Escala 5x2</strong><span id="usuario"></span></header>
<main id="app"></main>
<div id="modal" class="modal" hidden><div id="modalBox" class="modal-box"></div></div>
<div id="toast"></div>

<script>
'use strict';
const CHAVE = 'quintal_escala_v1';
const DIAS = ['Seg','Ter','Qua','Qui','Sex','Sáb','Dom'];
const DIAS_L = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
const MESES = ['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const FUNCOES = { cozinha:'Cozinha', salao:'Salão', caixa:'Caixa', bar:'Bar e chopeira' };
const CATEGORIAS = ['Saúde / consulta','Família','Estudo','Transporte','Compromisso pessoal','Outro'];
const app = document.getElementById('app');
const usuario = document.getElementById('usuario');

let estado = null;
let semanaGestor = '';
let abaGestor = 'pedidos';
let mesFunc = 0;

// ---------- utilidades ----------
function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v === false || v == null) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else if (k === 'value' || k === 'checked' || k === 'disabled' || k === 'selected') el[k] = v;
    else el.setAttribute(k, v);
  }
  for (const c of kids.flat(Infinity)) {
    if (c == null || c === false) continue;
    el.append(c.nodeType ? c : document.createTextNode(String(c)));
  }
  return el;
}
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const parse = s => new Date(s + 'T12:00:00');
const addDias = (s, n) => { const d = parse(s); d.setDate(d.getDate() + n); return iso(d); };
const diffDias = (a, b) => Math.round((parse(a) - parse(b)) / 86400000);
const dowM = s => (parse(s).getDay() + 6) % 7;            // 0 = segunda ... 6 = domingo
const iniSemana = s => addDias(s, -dowM(s));
const hojeISO = () => iso(new Date());
const dataBR = s => s.slice(8, 10) + '/' + s.slice(5, 7);
const dataBRfull = s => dataBR(s) + '/' + s.slice(0, 4);
const idxSemana = ws => Math.round((parse(ws) - parse('2024-01-01')) / (7 * 86400000));
const num = v => { const n = parseFloat(String(v).replace(',', '.')); return isNaN(n) ? 0 : n; };
const stamp = () => { const d = new Date(); return pad(d.getDate()) + '/' + pad(d.getMonth() + 1) + ' ' + pad(d.getHours()) + ':' + pad(d.getMinutes()); };
const parTxt = p => (p && p.length) ? p.map(i => DIAS_L[i]).join(' e ') : '—';
const funcionario = id => estado.funcionarios.find(f => f.id === id);
const feriadoDe = data => { const x = estado.feriados.find(f => f.data === data); return x ? x.nome : ''; };
const equipeDe = funcao => estado.funcionarios.filter(f => !f.gestor && f.funcao === funcao);
const normNome = n => n.normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();
async function hashCPF(cpf) {
  const d = cpf.replace(/\D/g, '');
  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('quintal-escala|' + d));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, '0')).join('');
}
function salvar() { localStorage.setItem(CHAVE, JSON.stringify(estado)); }
function logar(txt) { estado.log.unshift({ t: stamp(), texto: txt }); estado.log = estado.log.slice(0, 150); }

function toast(msg, erro) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.className = 'show' + (erro ? ' erro' : '');
  clearTimeout(toast.t); toast.t = setTimeout(() => (t.className = ''), 4200);
}
function abrirModal(...c) {
  const box = document.getElementById('modalBox');
  box.replaceChildren(...c.flat().filter(x => x != null && x !== false));
  document.getElementById('modal').hidden = false;
}
function fecharModal() { document.getElementById('modal').hidden = true; }
document.getElementById('modal').addEventListener('click', e => { if (e.target.id === 'modal') fecharModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') fecharModal(); });

// ---------- dados iniciais (equipe fictícia) ----------
// base = dois dias de folga (0 = segunda ... 6 = domingo); off = deslocamento do rodízio de domingo
const DEMO = [
  { nome: 'Marina Gestora', cpf: '900.000.000-01', funcao: 'cozinha', gestor: true },
  { nome: 'Carlos Souza', cpf: '100.000.000-01', funcao: 'cozinha', base: [0, 1], off: 0, turno: 'Manhã/Tarde' },
  { nome: 'Ana Beatriz Lima', cpf: '100.000.000-02', funcao: 'cozinha', base: [1, 2], off: 1, turno: 'Manhã/Tarde' },
  { nome: 'Pedro Henrique Alves', cpf: '100.000.000-03', funcao: 'cozinha', base: [2, 3], off: 2, turno: 'Tarde/Noite' },
  { nome: 'Joana Martins', cpf: '100.000.000-04', funcao: 'cozinha', base: [0, 3], off: 3, turno: 'Tarde/Noite' },
  { nome: 'Rafael Costa', cpf: '100.000.000-05', funcao: 'cozinha', base: [1, 3], off: 0, turno: 'Tarde/Noite' },
  { nome: 'Fernanda Rocha', cpf: '200.000.000-01', funcao: 'salao', base: [0, 1], off: 0, turno: 'Tarde/Noite' },
  { nome: 'Lucas Pereira', cpf: '200.000.000-02', funcao: 'salao', base: [1, 2], off: 1, turno: 'Tarde/Noite' },
  { nome: 'Camila Duarte', cpf: '200.000.000-03', funcao: 'salao', base: [2, 3], off: 2, turno: 'Tarde/Noite' },
  { nome: 'Bruno Teixeira', cpf: '200.000.000-04', funcao: 'salao', base: [0, 3], off: 3, turno: 'Tarde/Noite' },
  { nome: 'Patrícia Nogueira', cpf: '300.000.000-01', funcao: 'caixa', base: [0, 1], off: 0, turno: 'Tarde/Noite' },
  { nome: 'Rodrigo Mendes', cpf: '300.000.000-02', funcao: 'caixa', base: [2, 3], off: 2, turno: 'Tarde/Noite' },
  { nome: 'Tiago Ribeiro', cpf: '400.000.000-01', funcao: 'bar', base: [1, 2], off: 1, turno: 'Tarde/Noite' },
  { nome: 'Larissa Gomes', cpf: '400.000.000-02', funcao: 'bar', base: [0, 3], off: 3, turno: 'Tarde/Noite' }
];

const REGRAS_INICIAIS = [
  { titulo: 'Repouso semanal de 2 dias (EC 141/2026)', status: 'lei', ativo: true, fonte: 'EC 141, de 16/10/2026: art. 7º, XV, e art. 10, I',
    descricao: 'O repouso semanal remunerado passa a ser de 2 dias, um deles preferencialmente aos domingos. Entra em vigor 2 meses após a publicação (cerca de 16/12/2026). Antes disso, a escala 5x2 é uma política da casa.' },
  { titulo: 'Jornada: 8 h por dia e limite semanal gradual', status: 'lei', ativo: true, fonte: 'EC 141: art. 6º, I e II, e art. 7º, XIII',
    descricao: 'Limite semanal de 42 h a partir de 2 meses após a publicação e de 40 h um ano depois, sem redução de salário. Cinco dias de 8 horas somam 40 h por semana.' },
  { titulo: 'Cláusulas de CCT incompatíveis perdem efeito', status: 'confirmar', ativo: true, fonte: 'EC 141, art. 3º',
    descricao: 'Passados 2 meses da publicação, cláusulas de convenção sobre jornada e repouso incompatíveis com a emenda ficam sem efeito. Conferir com o sindicato quais cláusulas da CCT são atingidas (por exemplo 12x36, banco de horas e intervalos).' },
  { titulo: 'Folga extra mensal em domingo', status: 'confirmar', ativo: true, fonte: 'CCT 2025/2026, cláusula 42 e §§',
    descricao: 'Quem trabalha em estabelecimento que abre aos domingos recebe uma folga extra por mês, obrigatoriamente em domingo, para ambos os gêneros. Se for trabalhada, é paga em dobro; não entra em compensação de horário e deve constar de escala predefinida. O sistema usa o parâmetro "folga em domingo ao menos a cada X dias" para alertar. Interpretação a confirmar com o sindicato.' },
  { titulo: 'Feriado trabalhado', status: 'cct', ativo: true, fonte: 'CCT 2025/2026, cláusula 42, §3º e §4º',
    descricao: 'Feriado trabalhado pode ser compensado até 15 dias antes ou depois, sem prejuízo da folga semanal; se não houver compensação, é pago em dobro. É vedado usar banco de horas em feriados e em folgas dominicais trabalhadas.' },
  { titulo: 'Máximo de dias seguidos de trabalho', status: 'sistema', ativo: true, fonte: 'Trava do sistema (parâmetro editável)',
    descricao: 'O sistema bloqueia mudanças que deixem mais dias seguidos de trabalho do que o limite configurado (padrão: 6).' },
  { titulo: 'Controle de jornada', status: 'cct', ativo: true, fonte: 'CCT 2025/2026, cláusula 43',
    descricao: 'É obrigatório controlar a jornada por livro ou ponto (mecânico, magnético ou digital), qualquer que seja o número de funcionários. Este sistema organiza a escala; não substitui o controle de ponto.' },
  { titulo: 'Convenção vigente e CCT 2026/2027', status: 'confirmar', ativo: true, fonte: 'CCT 2025/2026, cláusula 59',
    descricao: 'A CCT 2025/2026 teve vigência até 31/07/2026 e a cláusula 59 mantém as condições até nova convenção ser assinada. A CCT 2026/2027 ainda não saiu. Quando sair, atualize os parâmetros e as regras desta aba.' },
  { titulo: 'Medidas transitórias para micro e pequenas empresas', status: 'confirmar', ativo: true, fonte: 'EC 141, art. 5º',
    descricao: 'Lei complementar poderá criar medidas transitórias, condicionadas à manutenção de empregos, para MEI, microempresas e empresas de pequeno porte. Acompanhar a regulamentação.' }
];

const FERIADOS_INICIAIS = [
  ['2026-11-20', 'Consciência Negra'], ['2026-12-25', 'Natal'], ['2027-01-01', 'Confraternização Universal'],
  ['2027-03-26', 'Sexta-feira Santa'], ['2027-04-21', 'Tiradentes'], ['2027-05-01', 'Dia do Trabalho'],
  ['2027-09-07', 'Independência'], ['2027-10-12', 'N. Sra. Aparecida'], ['2027-11-02', 'Finados'],
  ['2027-11-15', 'Proclamação da República'], ['2027-11-20', 'Consciência Negra'], ['2027-12-25', 'Natal']
].map(([data, nome]) => ({ data, nome }));

async function criarEstadoInicial() {
  const funcionarios = [];
  for (const [i, d] of DEMO.entries()) {
    funcionarios.push({ id: 'f' + (i + 1), nome: d.nome, cpfHash: await hashCPF(d.cpf), cpfFim: d.cpf.slice(-2), funcao: d.funcao,
      turno: d.turno || '', base: d.base || [], off: d.off || 0, horas: 8, gestor: !!d.gestor, demo: true });
  }
  estado = {
    v: 1, demoAtivo: true,
    params: { cctNome: 'CCT 2025/2026 (SP009729/2025); a de 2026/2027 ainda não saiu', folgasSemana: 2, maxSeguidos: 6, horasDia: 8,
      limiteAtual: 44, limiteApos1: 42, limiteApos2: 40, dataEmenda: '2026-12-16', dataLimite40: '2027-12-16',
      domingoACadaDias: 30, feriadoCompDias: 15 },
    minimos: { cozinha: [2, 2, 2, 2, 3, 3, 3], salao: [2, 2, 2, 2, 3, 4, 3], caixa: [1, 1, 1, 1, 1, 2, 1], bar: [1, 1, 1, 1, 1, 2, 1] },
    funcionarios, escala: {}, pedidos: [], feriados: FERIADOS_INICIAIS,
    regras: REGRAS_INICIAIS.map((r, i) => Object.assign({ id: 'r' + (i + 1) }, r)), log: []
  };
  // pedido urgente de demonstração (gera "furo" na segunda-feira da próxima semana)
  const lucas = funcionarios.find(f => f.nome === 'Lucas Pereira');
  const prox = addDias(iniSemana(hojeISO()), 7);
  estado.pedidos.push({ id: 'p0', funcId: lucas.id, semana: prox, antigo: parDe(lucas, prox), novo: [0, 2],
    categoria: 'Estudo', motivo: 'Prova na segunda-feira (pedido de demonstração)', status: 'pendente', criadoEm: stamp() });
  logar('Sistema iniciado com equipe fictícia de demonstração.');
  salvar();
}

// ---------- motor de escala ----------
// Folgas da semana: usa alteração manual, se houver; senão, a folga-base com rodízio de domingo (a cada 4 semanas).
function parDe(f, ws, ov) {
  const o = ov || estado.escala; const k = ws + '|' + f.id;
  if (o[k]) return o[k];
  if (estado.params.domingoACadaDias > 0 && (((idxSemana(ws) + f.off) % 4) + 4) % 4 === 0 && !f.base.includes(6))
    return [f.base[0], 6].sort((a, b) => a - b);
  return f.base.slice();
}
const diaFolga = (f, data, ov) => parDe(f, iniSemana(data), ov).includes(dowM(data));
function maxSeguidos(f, ws, ov) {
  let max = 0, run = 0;
  for (let n = -7; n < 21; n++) { if (diaFolga(f, addDias(ws, n), ov)) run = 0; else { run++; if (run > max) max = run; } }
  return max;
}
function diasSemDomingo(f, ref, ov) {
  let d = addDias(iniSemana(ref), 6); if (d > ref) d = addDias(d, -7);
  for (let k = 0; k < 12; k++) { if (diaFolga(f, d, ov)) return diffDias(ref, d); d = addDias(d, -7); }
  return 999;
}
function limiteEm(ws) {
  const p = estado.params;
  if (ws >= p.dataLimite40) return p.limiteApos2;
  if (ws >= p.dataEmenda) return p.limiteApos1;
  return p.limiteAtual;
}
function cobertura(funcao, ws, ov) {
  const eq = equipeDe(funcao);
  return DIAS.map((_, d) => eq.filter(f => !parDe(f, ws, ov).includes(d)).length);
}
function furos(funcao, ws, ov) {
  const c = cobertura(funcao, ws, ov), m = estado.minimos[funcao] || [];
  const r = []; c.forEach((v, d) => { if (v < (m[d] || 0)) r.push({ dia: d, falta: m[d] - v }); });
  return r;
}
const totalFalta = arr => arr.reduce((a, x) => a + x.falta, 0);

// Erros bloqueantes de uma mudança de folga
function validar(f, ws, par, ov) {
  const p = estado.params, o = ov || estado.escala, m = [];
  if (par.length !== p.folgasSemana) m.push('A semana precisa ter exatamente ' + p.folgasSemana + ' folgas.');
  const antigo = parDe(f, ws, o), hoje = hojeISO();
  for (let d = 0; d < 7; d++) if (addDias(ws, d) < hoje && par.includes(d) !== antigo.includes(d)) { m.push('Dias que já passaram não podem mudar.'); break; }
  const tmp = Object.assign({}, o, { [ws + '|' + f.id]: par });
  const ms = maxSeguidos(f, ws, tmp);
  if (ms > p.maxSeguidos) m.push('Isso deixaria ' + ms + ' dias seguidos de trabalho (máximo ' + p.maxSeguidos + ').');
  return m;
}
// Avisos que não bloqueiam
function avisosDe(f, ws, tmp) {
  const p = estado.params, par = parDe(f, ws, tmp), a = [];
  if (p.domingoACadaDias > 0) {
    const sd = diasSemDomingo(f, addDias(ws, 6), tmp);
    if (sd > p.domingoACadaDias) a.push('Ficaria ' + (sd >= 999 ? 'muito tempo' : sd + ' dias') + ' sem folga em domingo (referência: 1 a cada ' + p.domingoACadaDias + ' dias; regra a confirmar).');
  }
  const horas = (7 - par.length) * (f.horas || p.horasDia), lim = limiteEm(ws);
  if (horas > lim) a.push('A carga seria de ' + horas + ' h na semana, acima do limite de ' + lim + ' h.');
  for (let d = 0; d < 7; d++) {
    const data = addDias(ws, d), fer = feriadoDe(data);
    if (fer && !par.includes(d)) a.push('Trabalha no feriado "' + fer + '" (' + dataBR(data) + '): compensar em até ' + p.feriadoCompDias + ' dias ou pagar em dobro.');
  }
  return a;
}
// Sugestão de remanejamento: troca folgas de colegas da mesma função para tapar furos, sem quebrar as travas.
function sugerir(funcao, ws, ov, ignorarId) {
  const hoje = hojeISO(); let trabalho = Object.assign({}, ov); const sug = [];
  const antes = furos(funcao, ws, ov);
  for (let guard = 0; guard < 12; guard++) {
    const fs = furos(funcao, ws, trabalho); if (!fs.length) break;
    const fur = fs[0]; let achou = false;
    for (const f of equipeDe(funcao)) {
      if (achou) break;
      if (f.id === ignorarId) continue;
      const par = parDe(f, ws, trabalho);
      if (!par.includes(fur.dia) || addDias(ws, fur.dia) < hoje) continue;
      for (let d2 = 0; d2 < 7; d2++) {
        if (par.includes(d2) || addDias(ws, d2) < hoje) continue;
        const novo = par.filter(x => x !== fur.dia).concat(d2).sort((a, b) => a - b);
        if (validar(f, ws, novo, trabalho).length) continue;
        const t2 = Object.assign({}, trabalho, { [ws + '|' + f.id]: novo });
        if (totalFalta(furos(funcao, ws, t2)) >= totalFalta(fs)) continue;
        trabalho = t2; achou = true;
        sug.push({ id: f.id, nome: f.nome, de: par, para: novo, texto: f.nome + ': folga ' + parTxt(par) + ' passa para ' + parTxt(novo) });
        break;
      }
    }
    if (!achou) break;
  }
  const restantes = furos(funcao, ws, trabalho);
  return { ws, furosAntes: antes, sugestoes: sug, restantes, resolve: restantes.length === 0 };
}
function aplicarMudanca(f, ws, par, remanejo, motivo) {
  estado.escala[ws + '|' + f.id] = par;
  (remanejo || []).forEach(s => { estado.escala[ws + '|' + s.id] = s.para; });
  logar(motivo + ': ' + f.nome + ', semana de ' + dataBR(ws) + ' (' + parTxt(par) + ')' + ((remanejo || []).length ? ' com ' + remanejo.length + ' troca(s) de colegas' : ''));
  salvar();
}
function auditar(f, ws) {
  const p = estado.params, par = parDe(f, ws), motivos = [];
  const ms = maxSeguidos(f, ws), sd = diasSemDomingo(f, addDias(ws, 6));
  const horas = (7 - par.length) * (f.horas || p.horasDia), lim = limiteEm(ws), fers = [];
  for (let d = 0; d < 7; d++) { const dt = addDias(ws, d), fer = feriadoDe(dt); if (fer && !par.includes(d)) fers.push(fer + ' (' + dataBR(dt) + ')'); }
  if (par.length < p.folgasSemana) motivos.push('menos de ' + p.folgasSemana + ' folgas');
  if (ms > p.maxSeguidos) motivos.push(ms + ' dias seguidos');
  if (p.domingoACadaDias > 0 && sd > p.domingoACadaDias) motivos.push('sem folga em domingo há mais de ' + p.domingoACadaDias + ' dias (a confirmar)');
  if (horas > lim) motivos.push(horas + ' h acima do limite de ' + lim + ' h');
  return { f, folgas: par.length, ms, sd, horas, lim, fers, motivos };
}

// ---------- sessão e entrada ----------
function barra(nome, papel) {
  document.body.classList.remove('entrada');
  usuario.replaceChildren(h('span', { class: 'sutil' }, nome + ' · ' + papel), h('button', { class: 'pq', onclick: sair }, 'Sair'));
}
function sair() { sessionStorage.removeItem('quintal_sessao'); telaEntrada(); }
function telaEntrada() {
  usuario.replaceChildren(); document.body.classList.add('entrada');
  const nome = h('input', { placeholder: 'Nome completo', 'aria-label': 'Nome completo', autocomplete: 'off' });
  const cpf = h('input', { inputmode: 'numeric', maxlength: '14', placeholder: 'CPF', 'aria-label': 'CPF', autocomplete: 'off' });
  cpf.addEventListener('input', () => {
    const d = cpf.value.replace(/\D/g, '').slice(0, 11);
    cpf.value = d.replace(/^(\d{3})(\d)/, '$1.$2').replace(/^(\d{3})\.(\d{3})(\d)/, '$1.$2.$3').replace(/^(\d{3})\.(\d{3})\.(\d{3})(\d)/, '$1.$2.$3-$4');
  });
  const msg = h('div');
  const botao = h('button', { class: 'cheio', type: 'submit' }, 'Entrar');
  const form = h('form', { class: 'entra-card', novalidate: 'novalidate' }, nome, cpf, msg, botao);
  form.addEventListener('submit', async ev => {
    ev.preventDefault(); botao.disabled = true;
    try {
      const hs = await hashCPF(cpf.value), n = normNome(nome.value);
      const f = estado.funcionarios.find(x => normNome(x.nome) === n && x.cpfHash === hs);
      if (!f) throw new Error('Nome ou CPF não conferem.');
      sessionStorage.setItem('quintal_sessao', f.id); iniciar();
    } catch (e) { msg.replaceChildren(h('div', { class: 'msg erro' }, e.message)); }
    finally { botao.disabled = false; }
  });
  const demo = estado.demoAtivo ? h('div', { class: 'card demo' }, h('h3', {}, 'Contas de demonstração (fictícias)'),
    h('p', { class: 'sutil pequeno' }, 'Toque para preencher. Não use CPF real neste protótipo.'),
    DEMO.map(d => h('button', { class: 'pq', type: 'button', onclick: () => { nome.value = d.nome; cpf.value = d.cpf; } }, d.nome + (d.gestor ? ' (gestora)' : '')))) : null;
  app.replaceChildren(h('div', { class: 'entra' }, h('h1', {}, 'Quintal do Carmo'), h('p', { class: 'sutil' }, 'Escala de folgas 5x2'), form, demo));
  nome.focus();
}
function iniciar() {
  const f = funcionario(sessionStorage.getItem('quintal_sessao'));
  if (!f) return telaEntrada();
  if (f.gestor) { semanaGestor = semanaGestor || iniSemana(hojeISO()); return painelGestor(); }
  painelFuncionario(f);
}

// ---------- componentes ----------
function listaMsg(arr, erro) { return h('div', { class: 'msg' + (erro ? ' erro' : '') }, h('ul', {}, arr.map(x => h('li', {}, x)))); }
function seletorDias(ws, parInicial, aoMudar) {
  const hoje = hojeISO(), sel = new Set(parInicial), max = estado.params.folgasSemana;
  const box = h('div', { class: 'semana' });
  const els = DIAS.map((nome, d) => {
    const data = addDias(ws, d), travado = data < hoje, fer = feriadoDe(data);
    const el = h('div', { class: 'dia escolha' + (travado ? ' travado' : ''), tabindex: travado ? '-1' : '0', role: 'button' },
      h('b', {}, nome), h('small', {}, dataBR(data)), h('span', { class: 't' }, ''), fer ? h('span', { class: 'fer' }, fer) : null);
    const alterna = () => {
      if (travado) return;
      if (sel.has(d)) sel.delete(d);
      else if (sel.size < max) sel.add(d);
      else { toast('Desmarque um dia antes de escolher outro.', true); return; }
      pinta();
    };
    el.addEventListener('click', alterna);
    el.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alterna(); } });
    box.append(el); return { el, d, travado };
  });
  function pinta() {
    els.forEach(x => { const on = sel.has(x.d); x.el.classList.toggle('sel', on);
      x.el.querySelector('.t').textContent = x.travado ? (on ? 'folga (passou)' : 'passou') : (on ? 'FOLGA' : 'trabalho'); });
    aoMudar(sel);
  }
  pinta();
  return { box, sel };
}
function blocoPlano(pl, titulo) {

    h('ul', {}, pl.furosAntes.map(x => h('li', {}, DIAS_L[x.dia] + ' (' + dataBR(addDias(pl.ws, x.dia)) + '): falta ' + x.falta + (x.falta > 1 ? ' pessoas' : ' pessoa')))),

    pl.resolve ? null : h('p', {}, 'Não achei como cobrir tudo sem quebrar as travas. Ajuste outras folgas na aba Escala ou recuse.'));
}

      h('div', {}, h('b', {}, n === 0 ? 'Esta semana' : 'Próxima semana'), h('span', { class: 'sutil' }, ' (' + dataBR(ws) + ' a ' + dataBR(addDias(ws, 6)) + ')'),
        h('div', {}, 'Folgas: ', h('b', {}, parTxt(par))),

      h('p', { class: 'sutil pequeno' }, 'Depois da próxima semana a escala é uma previsão e pode mudar. Dias com nome embaixo são feriados.')),
    h('div', { class: 'card' }, h('h2', {}, 'Mudar uma folga'),

function modalPedido(f, ws) {
  const msg = h('div'), enviar = h('button', { class: 'cheio', disabled: true }, 'Enviar pedido ao gestor');
  const atual = parDe(f, ws);
  const { box, sel } = seletorDias(ws, atual, s => {
    msg.replaceChildren(); enviar.disabled = true;
    if (s.size !== estado.params.folgasSemana) return;
    const par = [...s].sort((a, b) => a - b);
    if (par.join() === atual.join()) return;
    const erros = validar(f, ws, par);
    if (erros.length) { msg.append(listaMsg(erros, true)); return; }
    const av = avisosDe(f, ws, Object.assign({}, estado.escala, { [ws + '|' + f.id]: par }));
    if (av.length) msg.append(listaMsg(av, false));
    enviar.disabled = false;
  });
  const cat = h('select', {}, CATEGORIAS.map(c => h('option', { value: c }, c)));
  const motivo = h('textarea', { rows: '2', maxlength: '140', placeholder: 'Só o necessário. Evite detalhes de saúde.' });
  enviar.addEventListener('click', () => {
    const par = [...sel].sort((a, b) => a - b);
    estado.pedidos.filter(p => p.funcId === f.id && p.semana === ws && p.status === 'pendente').forEach(p => (p.status = 'cancelada'));
    estado.pedidos.push({ id: 'p' + Date.now(), funcId: f.id, semana: ws, antigo: atual, novo: par, categoria: cat.value, motivo: motivo.value.trim().slice(0, 140), status: 'pendente', criadoEm: stamp() });
    logar(f.nome + ' pediu mudança de folga na semana de ' + dataBR(ws) + ' (' + parTxt(par) + ')');
    salvar(); fecharModal(); toast('Gestor alertado. Aguarde a decisão.'); painelFuncionario(f);
  });
  abrirModal(h('h2', {}, 'Pedido de mudança'),
    h('p', { class: 'sutil' }, 'Folgas atuais: ' + parTxt(atual) + '. Toque nos ' + estado.params.folgasSemana + ' dias da nova folga.'), box,
    h('label', {}, 'Categoria'), cat, h('label', {}, 'Motivo (opcional)'), motivo, msg,
    h('div', { class: 'acoes' }, enviar, h('button', { onclick: fecharModal }, 'Cancelar')));
}

function seletorSemana() {
  const base = iniSemana(hojeISO()), ops = [];
  for (let n = -2; n <= 9; n++) {
    const ws = addDias(base, n * 7);
    const rot = n < 0 ? 'passada' : n === 0 ? 'atual' : n === 1 ? 'próxima' : 'previsão';
    ops.push(h('option', { value: ws, selected: ws === semanaGestor }, 'Semana de ' + dataBR(ws) + ' a ' + dataBR(addDias(ws, 6)) + ' (' + rot + ')'));
  }
  return h('select', { onchange: e => { semanaGestor = e.target.value; painelGestor(); } }, ops);
}
